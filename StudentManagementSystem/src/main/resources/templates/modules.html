<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}"></head>

<body>

    <div class="d-flex" id="wrapper">

        <!-- Sidebar -->
        <div th:replace="~{fragments/layout::sidebar}"></div>


        <!-- Page Content -->
        <div id="page-content-wrapper">

            <!-- Navbar -->
            <div th:replace="~{fragments/layout::navbar}"></div>


            <!-- Main Content -->
            <div class="container-fluid px-4 py-4">


                <!-- ============================= -->
                <!-- HEADER -->
                <!-- ============================= -->

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2>Modules</h2>

                    <a th:href="@{/module/new}"
                       class="btn btn-primary">

                        <i class="bi bi-plus-lg me-1"></i>

                        Add New Module

                    </a>

                </div>


                <!-- ============================= -->
                <!-- SUCCESS MESSAGE -->
                <!-- ============================= -->

                <div th:if="${message}"
                     class="alert alert-success text-center"
                     role="alert"
                     th:text="${message}">
                </div>


                <!-- ============================= -->
                <!-- MODULE CARD -->
                <!-- ============================= -->

                <div class="card mb-4">


                    <!-- CARD HEADER -->

                    <div class="card-header bg-white">

                        <i class="bi bi-table me-1"></i>

                        Module List

                    </div>


                    <!-- CARD BODY -->

                    <div class="card-body">


                        <!-- ============================= -->
                        <!-- NO MODULE FOUND -->
                        <!-- ============================= -->

                        <div class="text-muted"
                             th:if="${modules.content.isEmpty()}">

                            No Module Found

                        </div>


                        <!-- ============================= -->
                        <!-- TABLE -->
                        <!-- ============================= -->

                        <div class="table-responsive"
                             th:if="${!modules.content.isEmpty()}">

                            <table class="table table-hover table-striped">


                                <!-- TABLE HEADER -->

                                <thead>

                                    <tr>

                                        <th>ID</th>

                                        <th>Module Number</th>

                                        <th>Module Name</th>

                                        <th>Subject</th>

                                        <th>Description</th>

                                        <th>Actions</th>

                                    </tr>

                                </thead>


                                <!-- TABLE BODY -->

                                <tbody>

                                    <tr th:each="module : ${modules.content}">


                                        <!-- ID -->

                                        <td data-label="ID"
                                            th:text="${module.id}">
                                        </td>


                                        <!-- MODULE NUMBER -->

                                        <td data-label="Module Number"
                                            th:text="${module.moduleNumber}">
                                        </td>


                                        <!-- MODULE NAME -->

                                        <td data-label="Module Name"
                                            th:text="${module.name}">
                                        </td>


                                        <!-- SUBJECT -->

                                        <td data-label="Subject"
                                            th:text="${module.subject}">
                                        </td>


                                        <!-- DESCRIPTION -->

                                        <td data-label="Description"
                                            th:text="${module.description}">
                                        </td>


                                        <!-- ACTIONS -->

                                        <td data-label="Actions">


                                            <!-- VIEW -->

                                            <a th:href="@{'/module/' + ${module.id}}"
                                               class="btn btn-sm btn-info text-white me-1"
                                               title="View">

                                                <i class="bi bi-eye"></i>

                                            </a>


                                            <!-- EDIT -->

                                            <a th:href="@{/module/{id}/edit(id=${module.id})}"
                                               class="btn btn-sm btn-warning text-white me-1"
                                               title="Edit">

                                                <i class="bi bi-pencil"></i>

                                            </a>


                                            <!-- DELETE -->

                                            <form th:action="@{/module/{id}/delete(id=${module.id})}"
                                                  method="post"
                                                  style="display:inline;">

                                                <button type="submit"
                                                        class="btn btn-sm btn-danger"
                                                        title="Delete"
                                                        onclick="return confirm('Are you sure you want to delete this module?');">

                                                    <i class="bi bi-trash"></i>

                                                </button>

                                            </form>

                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>


                        <!-- ============================= -->
                        <!-- PAGINATION -->
                        <!-- ============================= -->

                        <nav th:if="${modules.totalPages > 1}"
                             aria-label="Module pagination">

                            <ul class="pagination justify-content-end">


                                <!-- PREVIOUS -->

                                <li class="page-item"
                                    th:classappend="${modules.first} ? ' disabled'">

                                    <a class="page-link"
                                       th:href="@{/module/list(
                                           page=${modules.number > 0 ? modules.number - 1 : 0},
                                           size=${modules.size}
                                       )}">

                                        Previous

                                    </a>

                                </li>


                                <!-- PAGE NUMBERS -->

                                <li class="page-item"
                                    th:each="pageNum : ${#numbers.sequence(0, modules.totalPages - 1)}"
                                    th:classappend="${pageNum == modules.number} ? ' active'">

                                    <a class="page-link"
                                       th:href="@{/module/list(
                                           page=${pageNum},
                                           size=${modules.size}
                                       )}"
                                       th:text="${pageNum + 1}">

                                    </a>

                                </li>


                                <!-- NEXT -->

                                <li class="page-item"
                                    th:classappend="${modules.last} ? ' disabled'">

                                    <a class="page-link"
                                       th:href="@{/module/list(
                                           page=${modules.last ? modules.number : modules.number + 1},
                                           size=${modules.size}
                                       )}">

                                        Next

                                    </a>

                                </li>


                            </ul>

                        </nav>


                    </div>

                </div>


            </div>

        </div>

    </div>


    <!-- SCRIPTS -->

    <div th:replace="~{fragments/layout::scripts}"></div>


</body>

</html>
