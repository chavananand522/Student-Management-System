<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}"></head>

<body>

<div class="d-flex" id="wrapper">

    <div th:replace="~{fragments/layout::sidebar}"></div>

    <div id="page-content-wrapper">

        <div th:replace="~{fragments/layout::navbar}"></div>


        <div class="container-fluid px-4 py-4">


            <!-- HEADER -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2>View Module</h2>

                <div>

                    <a th:href="@{/module/{id}/edit(id=${module.id})}"
                       class="btn btn-warning text-white me-2">

                        <i class="bi bi-pencil me-1"></i>

                        Edit

                    </a>


                    <a th:href="@{/module/list}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left me-1"></i>

                        Back

                    </a>

                </div>

            </div>


            <!-- MODULE DETAILS -->

            <div class="card">

                <div class="card-header bg-white">

                    <i class="bi bi-journal-text me-1"></i>

                    Module Details

                </div>


                <div class="card-body">


                    <div class="row mb-3">

                        <div class="col-md-3 fw-bold">
                            ID
                        </div>

                        <div class="col-md-9"
                             th:text="${module.id}">

                        </div>

                    </div>


                    <div class="row mb-3">

                        <div class="col-md-3 fw-bold">
                            Module Number
                        </div>

                        <div class="col-md-9"
                             th:text="${module.moduleNumber}">

                        </div>

                    </div>


                    <div class="row mb-3">

                        <div class="col-md-3 fw-bold">
                            Module Name
                        </div>

                        <div class="col-md-9"
                             th:text="${module.name}">

                        </div>

                    </div>


                    <div class="row mb-3">

                        <div class="col-md-3 fw-bold">
                            Subject
                        </div>

                        <div class="col-md-9"
                             th:text="${module.subject}">

                        </div>

                    </div>


                    <div class="row mb-3">

                        <div class="col-md-3 fw-bold">
                            Description
                        </div>

                        <div class="col-md-9"
                             th:text="${module.description}">

                        </div>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


<div th:replace="~{fragments/layout::scripts}"></div>

</body>

</html>
