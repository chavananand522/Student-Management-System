<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}">
</head>

<body>

<div class="d-flex" id="wrapper">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/layout::sidebar}">
    </div>


    <!-- PAGE CONTENT -->
    <div id="page-content-wrapper">

        <!-- NAVBAR -->
        <div th:replace="~{fragments/layout::navbar}">
        </div>


        <div class="container-fluid px-4 py-4">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2>
                    Edit Module
                </h2>

                <a th:href="@{/study/{subject}(subject=${module.subject})}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left me-1"></i>

                    Back

                </a>

            </div>


            <!-- EDIT FORM -->
            <div class="card mb-4">

                <div class="card-header bg-white">

                    <i class="bi bi-pencil-square me-1"></i>

                    Module Details

                </div>


                <div class="card-body">

                    <form th:action="@{/module/{id}/update(id=${module.id})}"
                          th:object="${module}"
                          method="post">


                        <!-- SUBJECT AUTOMATICALLY PRESERVED -->
                        <input type="hidden"
                               th:field="*{subject}">


                        <!-- MODULE NUMBER -->
                        <div class="mb-3">

                            <label class="form-label">
                                Module Number
                            </label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{moduleNumber}"
                                   min="1"
                                   required>

                        </div>


                        <!-- MODULE NAME -->
                        <div class="mb-3">

                            <label class="form-label">
                                Module Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   required>

                        </div>


                        <!-- UPDATE BUTTON -->
                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-check-lg me-1"></i>

                            Update Module

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<div th:replace="~{fragments/layout::scripts}">
</div>

</body>
</html>
