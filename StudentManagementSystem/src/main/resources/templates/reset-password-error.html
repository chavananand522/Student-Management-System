<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="login-body">

<div class="card login-card" style="width: 100%; max-width: 460px;">

    <div class="login-header text-center text-white">
        <h2 class="mb-1 fw-bold">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Invalid Link
        </h2>
    </div>

    <div class="card-body p-4 p-md-5 text-center">

        <p class="text-muted"
           th:text="${error != null ? error : 'This password reset link is invalid or has expired.'}">
        </p>

        <a th:href="@{/forgot-password}"
           class="btn btn-primary">
            <i class="bi bi-arrow-clockwise me-1"></i>
            Request New Link
        </a>

        <div class="mt-3">
            <a th:href="@{/login}"
               class="text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i>
                Back to Login
            </a>
        </div>

    </div>

</div>

</body>

</html>
