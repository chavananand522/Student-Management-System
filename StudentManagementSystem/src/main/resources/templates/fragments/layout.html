<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="_csrf"
          th:content="${_csrf.token}">

    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">

    <title>SMS Admin</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->

    <link th:href="@{/css/style.css}"
          rel="stylesheet">

</head>

<body>

<!-- ================================================= -->
<!-- SIDEBAR -->
<!-- ================================================= -->

<div th:fragment="sidebar"
     class="bg-dark text-white"
     id="sidebar-wrapper">

    <!-- Sidebar Heading -->

    <div class="sidebar-heading border-bottom border-secondary">

        <i class="bi bi-mortarboard-fill me-2"></i>

        SMS Admin

    </div>

    <div class="list-group list-group-flush">

        <!-- ================================================= -->
        <!-- DASHBOARD -->
        <!-- ================================================= -->

        <a th:href="@{/dashboard}"
           class="sidebar-link">

            <i class="bi bi-speedometer2"></i>

            <span>Dashboard</span>

        </a>

        <!-- ================================================= -->
        <!-- COURSES -->
        <!-- ================================================= -->

        <a th:href="@{/course/list}"
           class="sidebar-link">

            <i class="bi bi-book"></i>

            <span>Courses</span>

        </a>

        <!-- ================================================= -->
        <!-- STUDENTS -->
        <!-- ================================================= -->

        <a th:href="@{/students/list}"
           class="sidebar-link">

            <i class="bi bi-people"></i>

            <span>Students</span>

        </a>

        <!-- ================================================= -->
        <!-- STUDY -->
        <!-- ================================================= -->

        <a class="sidebar-link study-main-link"
           data-bs-toggle="collapse"
           href="#studyMenu"
           role="button"
           aria-expanded="false"
           aria-controls="studyMenu">

            <i class="bi bi-mortarboard"></i>

            <span>Study</span>

            <i class="bi bi-chevron-down ms-auto study-arrow"></i>

        </a>

        <div class="collapse"
             id="studyMenu">

            <!-- Physics -->

            <a th:href="@{/study/physics}"
               class="sidebar-link study-sub-link">

                <i class="bi bi-lightning-charge"></i>

                <span>Physics</span>

            </a>

            <!-- Chemistry -->

            <a th:href="@{/study/chemistry}"
               class="sidebar-link study-sub-link">

                <i class="bi bi-droplet"></i>

                <span>Chemistry</span>

            </a>

            <!-- Biology -->

            <a th:href="@{/study/biology}"
               class="sidebar-link study-sub-link">

                <i class="bi bi-heart-pulse"></i>

                <span>Biology</span>

            </a>

        </div>

        <!-- ================================================= -->
        <!-- TESTS -->
        <!-- ================================================= -->

        <a class="sidebar-link test-main-link"
           data-bs-toggle="collapse"
           href="#testMenu"
           role="button"
           aria-expanded="false"
           aria-controls="testMenu">

            <i class="bi bi-file-earmark-text"></i>

            <span>Tests</span>

            <i class="bi bi-chevron-down ms-auto test-arrow"></i>

        </a>

        <div class="collapse"
             id="testMenu">

            <!-- CREATE TEST -->

            <a th:href="@{/tests/create}"
               class="sidebar-link study-sub-link">

                <i class="bi bi-plus-circle"></i>

                <span>Create Test</span>

            </a>

            <!-- TEST RESULTS -->

            <a th:href="@{/tests/list}"
               class="sidebar-link study-sub-link">

                <i class="bi bi-bar-chart"></i>

                <span>Test Results</span>

            </a>

            <!-- ANALYSIS -->

            <a th:href="@{/tests/analysis}"
               class="sidebar-link study-sub-link">

                <i class="bi bi-activity"></i>

                <span>Analysis</span>

            </a>

        </div>

        <!-- ================================================= -->
        <!-- ENROLLED STUDENTS -->
        <!-- ================================================= -->

        <a th:href="@{/enrollments/enrollmentList}"
           class="sidebar-link">

            <i class="bi bi-check2-square"></i>

            <span>Enrolled Students</span>

        </a>

        <!-- ================================================= -->
        <!-- ENROLL TO COURSE -->
        <!-- ================================================= -->

        <a th:href="@{/enrollments/showEnroll}"
           class="sidebar-link">

            <i class="bi bi-person-plus"></i>

            <span>Enroll to Course</span>

        </a>

        <!-- ================================================= -->
        <!-- AI ASSISTANT -->
        <!-- ================================================= -->

        <a th:href="@{/ai-assistant}"
           class="sidebar-link ai-sidebar-link">

            <i class="bi bi-robot"></i>

            <span>AI Assistant</span>

        </a>

    </div>

</div>

<!-- ================================================= -->
<!-- NAVBAR -->
<!-- ================================================= -->

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-light bg-light border-bottom">

    <div class="container-fluid">

        <!-- Sidebar Toggle -->

        <button class="btn btn-outline-secondary"
                id="sidebarToggle"
                type="button">

            <i class="bi bi-list"></i>

        </button>

        <!-- Mobile Navbar Toggle -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navbar Content -->

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">

            <ul class="navbar-nav ms-auto mt-2 mt-lg-0">

                <li class="nav-item dropdown">

                    <!-- Profile Dropdown Button -->

                    <a class="nav-link dropdown-toggle d-flex align-items-center"
                       href="#"
                       id="navbarDropdown"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        <img th:src="@{/profile/image}"
                             alt="Profile"
                             class="rounded-circle me-2 navbar-profile-img"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">

                        <i class="bi bi-person-circle me-2"
                           style="display:none;"></i>

                        <span>Admin User</span>

                    </a>

                    <!-- ================================================= -->
                    <!-- PROFILE DROPDOWN -->
                    <!-- ================================================= -->

                    <div class="dropdown-menu dropdown-menu-end shadow"
                         aria-labelledby="navbarDropdown">

                        <!-- Profile -->

                        <a class="dropdown-item py-2"
                           th:href="@{/profile}">

                            <i class="bi bi-person me-2"></i>

                            Profile

                        </a>

                        <!-- Leadership Board -->

                        <a class="dropdown-item py-2"
                           th:href="@{/leadership}">

                            <i class="bi bi-trophy me-2"></i>

                            Leadership Board

                        </a>

                        <!-- ID Card -->

                        <a class="dropdown-item py-2"
                           th:href="@{/id-card}">

                            <i class="bi bi-person-vcard me-2"></i>

                            ID Card

                        </a>

                        <!-- Fees Details -->

                        <a class="dropdown-item py-2"
                           th:href="@{/fees-details}">

                            <i class="bi bi-wallet2 me-2"></i>

                            Fees Details

                        </a>

                        <!-- System Tools -->

                        <a class="dropdown-item py-2"
                           th:href="@{/settings}">

                            <i class="bi bi-tools system-tools-icon me-2"></i>

                            System Tools

                        </a>

                        <div class="dropdown-divider"></div>

                        <!-- Logout -->

                        <form method="post"
                              th:action="@{/logout}"
                              style="margin:0;">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit"
                                    class="dropdown-item py-2">

                                <i class="bi bi-box-arrow-right me-2"></i>

                                Logout

                            </button>

                        </form>

                    </div>

                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- ================================================= -->
<!-- FOOTER -->
<!-- ================================================= -->

<footer th:fragment="footer"
        class="py-4 bg-light mt-auto border-top">

    <div class="container-fluid px-4">

        <div class="d-flex align-items-center justify-content-between small">

            <div class="text-muted">

                Student Management System

            </div>

            <div class="text-muted">

                © 2026 SMS Admin

            </div>

        </div>

    </div>

</footer>

<!-- ================================================= -->
<!-- SCRIPTS -->
<!-- ================================================= -->

<th:block th:fragment="scripts">

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            /* ========================================= */
            /* SIDEBAR TOGGLE */
            /* ========================================= */

            const sidebarToggle =
                document.getElementById("sidebarToggle");

            if (sidebarToggle) {

                sidebarToggle.addEventListener("click", function (event) {

                    event.preventDefault();

                    document.body.classList.toggle(
                        "sb-sidenav-toggled"
                    );

                });

            }

            /* ========================================= */
            /* STUDY MENU */
            /* ========================================= */

            const studyLink =
                document.querySelector(".study-main-link");

            const studyMenu =
                document.getElementById("studyMenu");

            if (studyLink && studyMenu) {

                studyMenu.addEventListener(
                    "show.bs.collapse",
                    function () {

                        studyLink.setAttribute(
                            "aria-expanded",
                            "true"
                        );

                        studyLink.classList.add(
                            "study-open"
                        );

                    }
                );

                studyMenu.addEventListener(
                    "hide.bs.collapse",
                    function () {

                        studyLink.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                        studyLink.classList.remove(
                            "study-open"
                        );

                    }
                );

            }

            /* ========================================= */
            /* TEST MENU */
            /* ========================================= */

            const testLink =
                document.querySelector(".test-main-link");

            const testMenu =
                document.getElementById("testMenu");

            if (testLink && testMenu) {

                testMenu.addEventListener(
                    "show.bs.collapse",
                    function () {

                        testLink.setAttribute(
                            "aria-expanded",
                            "true"
                        );

                        testLink.classList.add(
                            "test-open"
                        );

                    }
                );

                testMenu.addEventListener(
                    "hide.bs.collapse",
                    function () {

                        testLink.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                        testLink.classList.remove(
                            "test-open"
                        );

                    }
                );

            }

        });

    </script>

</th:block>

</body>

</html>
