<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}">
</head>

<body>

<div class="d-flex" id="wrapper">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/layout::sidebar}">
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1">

        <!-- NAVBAR -->
        <div th:replace="~{fragments/layout::navbar}">
        </div>

        <main class="container-fluid p-4">

            <!-- BREADCRUMB -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item">
                        <a th:href="@{/tests/list}"
                           class="text-decoration-none">
                            Tests
                        </a>
                    </li>
                    <li class="breadcrumb-item active"
                        aria-current="page">
                        Test Results
                    </li>
                </ol>
            </nav>

            <!-- PAGE HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h3 class="fw-bold mb-1">
                        <i class="bi bi-file-earmark-text me-2"></i>
                        Tests
                    </h3>

                    <p class="text-muted mb-0">
                        Manage your tests
                    </p>

                </div>

                <a th:href="@{/tests/create}"
                   class="btn btn-primary">

                    <i class="bi bi-plus-circle me-1"></i>
                    Create Test

                </a>

            </div>

            <!-- TEST TABLE -->
            <div class="card border-0 shadow-sm">

                <div class="card-body p-0">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle mb-0">

                            <thead class="table-light">

                            <tr>

                                <th class="px-4">#</th>

                                <th>Test Name</th>

                                <th>Course</th>

                                <th>Subject</th>

                                <th>Chapter</th>

                                <th>Questions</th>

                                <th>Total Marks</th>

                                <th>Status</th>

                                <th class="text-center">
                                    Actions
                                </th>

                            </tr>

                            </thead>

                            <tbody>

                            <!-- TEST ROW -->
                            <tr th:each="test, stat : ${tests}">

                                <td class="px-4"
                                    th:text="${stat.count}">
                                    1
                                </td>

                                <td>
                                    <strong th:text="${test.testName}">
                                        Test Name
                                    </strong>
                                </td>

                                <td th:text="${test.course}">
                                    NEET
                                </td>

                                <td th:text="${test.subject}">
                                    Physics
                                </td>

                                <td th:text="${test.chapter}">
                                    Chapter 1
                                </td>

                                <td>
                                    <span class="badge bg-primary"
                                          th:text="${test.questions != null ? test.questions.size() : 0}">
                                        0
                                    </span>
                                </td>

                                <td th:text="${test.totalMarks}">
                                    100
                                </td>

                                <td>

                                    <span th:if="${test.status == 'PUBLISHED'}"
                                          class="badge bg-success">
                                        Published
                                    </span>

                                    <span th:unless="${test.status == 'PUBLISHED'}"
                                          class="badge bg-secondary">
                                        Draft
                                    </span>

                                </td>

                                <!-- ACTIONS -->
                                <td class="text-center">

                                    <!-- VIEW -->
                                    <a th:href="@{/tests/results/{id}(id=${test.id})}"
                                       class="btn btn-sm btn-outline-primary me-1"
                                       title="View Test">

                                        <i class="bi bi-eye"></i>

                                    </a>

                                    <!-- EDIT -->
                                    <a th:href="@{/tests/edit/{id}(id=${test.id})}"
                                       class="btn btn-sm btn-outline-warning me-1"
                                       title="Edit Test">

                                        <i class="bi bi-pencil"></i>

                                    </a>

                                    <!-- DELETE -->
                                    <a th:href="@{/tests/delete/{id}(id=${test.id})}"
                                       class="btn btn-sm btn-outline-danger"
                                       title="Delete Test"
                                       onclick="return confirm('Are you sure you want to delete this test?');">

                                        <i class="bi bi-trash"></i>

                                    </a>

                                </td>

                            </tr>

                            <!-- NO TESTS -->
                            <tr th:if="${#lists.isEmpty(tests)}">

                                <td colspan="9"
                                    class="text-center py-5 text-muted">

                                    <i class="bi bi-file-earmark-x fs-1 d-block mb-3"></i>

                                    No tests found.

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>

</body>
</html>
