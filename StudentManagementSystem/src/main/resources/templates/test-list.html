<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f7f9fc;
            font-family: Arial, sans-serif;
            color: #172b4d;
        }
        .page-wrapper {
            padding: 30px;
        }
        .page-header {
            margin-bottom: 22px;
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .page-subtitle {
            color: #718096;
            font-size: 14px;
        }
        .add-btn {
            background: #2563eb;
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
        }
        .add-btn:hover {
            background: #1d4ed8;
            color: white;
        }
        .main-card {
            background: white;
            border: 1px solid #e5eaf0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(20, 40, 80, 0.04);
        }
        .filter-row {
            margin-bottom: 20px;
        }
        .search-box {
            border: 1px solid #d9e1ec;
            border-radius: 8px;
            padding: 10px 12px;
            width: 100%;
            outline: none;
        }
        .search-box:focus {
            border-color: #2563eb;
        }
        .test-table {
            border: 1px solid #e4eaf2;
            border-radius: 9px;
            overflow: hidden;
        }
        .test-table table {
            margin-bottom: 0;
        }
        .test-table th {
            background: #f1f5fa;
            color: #172b4d;
            font-size: 13px;
            padding: 13px;
            white-space: nowrap;
        }
        .test-table td {
            font-size: 13px;
            padding: 13px;
            vertical-align: middle;
        }
        .test-name {
            font-weight: 600;
            color: #172b4d;
        }
        .badge-published {
            background: #d9f7e8;
            color: #087443;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-draft {
            background: #fff3cd;
            color: #856404;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .view-btn {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 7px 12px;
            text-decoration: none;
            font-size: 12px;
        }
        .view-btn:hover {
            background: #1d4ed8;
            color: white;
        }
        .empty-box {
            text-align: center;
            padding: 50px 20px;
            color: #718096;
        }
        .empty-box i {
            font-size: 45px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <div class="page-title">Test List</div>
            <div class="page-subtitle">View and manage all your tests.</div>
        </div>
        <a th:href="@{/tests/create}" class="add-btn">
            <i class="bi bi-plus-lg"></i>
            Add New Test
        </a>
    </div>
    <div class="main-card">
        <div class="row filter-row">
            <div class="col-md-8">
                <input type="text" id="searchInput" class="search-box" placeholder="Search tests...">
            </div>
            <div class="col-md-4">
                <select id="subjectFilter" class="form-select">
                    <option value="">All Subjects</option>
                    <option value="Physics">Physics</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Biology">Biology</option>
                    <option value="Mathematics">Mathematics</option>
                </select>
            </div>
        </div>
        <div th:if="${tests != null and !tests.isEmpty()}" class="test-table">
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Test Name</th>
                    <th>Course</th>
                    <th>Subject</th>
                    <th>Chapter</th>
                    <th>Questions</th>
                    <th>Total Marks</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="testTableBody">
                <tr th:each="test, stat : ${tests}">
                    <td th:text="${stat.count}">1</td>
                    <td class="test-name" th:text="${test.testName}">Physics Test</td>
                    <td th:text="${test.course}">NEET</td>
                    <td class="subject-value" th:text="${test.subject}">Physics</td>
                    <td th:text="${test.chapter}">Chapter 1</td>
                    <td th:text="${test.questions != null ? #lists.size(test.questions) : 0}">10</td>
                    <td th:text="${test.totalMarks}">100</td>
                    <td>
                        <span th:if="${test.status == 'PUBLISHED'}" class="badge-published">Published</span>
                        <span th:unless="${test.status == 'PUBLISHED'}" class="badge-draft">Draft</span>
                    </td>
                    <td>
                        <a th:href="@{/tests/results/{id}(id=${test.id})}" class="view-btn">
                            <i class="bi bi-eye"></i>
                            View
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${tests == null or tests.isEmpty()}" class="empty-box">
            <i class="bi bi-file-earmark-text d-block mb-3"></i>
            <h5>No Tests Found</h5>
            <p>Create your first test to see it here.</p>
            <a th:href="@{/tests/create}" class="add-btn">Create Test</a>
        </div>
    </div>
</div>
<script>
    const searchInput = document.getElementById("searchInput");
    const subjectFilter = document.getElementById("subjectFilter");
    const rows = document.querySelectorAll("#testTableBody tr");
    function filterTests() {
        const search = searchInput.value.toLowerCase();
        const subject = subjectFilter.value.toLowerCase();
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            const rowSubject = row.querySelector(".subject-value")?.innerText.toLowerCase() || "";
            row.style.display = text.includes(search) && (subject === "" || rowSubject === subject) ? "" : "none";
        });
    }
    searchInput?.addEventListener("input", filterTests);
    subjectFilter?.addEventListener("change", filterTests);
</script>
</body>
</html>
