<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}">

</head>

<body>

<div id="wrapper">

    <!-- Sidebar -->

    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->

    <div id="page-content-wrapper">

        <!-- Navbar -->

        <div th:replace="~{fragments/layout :: navbar}"></div>

        <!-- Leadership Board -->

        <div class="container-fluid leadership-container">

            <!-- Page Title -->

            <h1 class="leadership-title">

                <span class="animated-trophy">

                    <svg viewBox="0 0 220 220"
                         xmlns="http://www.w3.org/2000/svg">

                        <defs>

                            <!-- Main Gold -->

                            <linearGradient id="goldTrophy"
                                            x1="0%"
                                            y1="0%"
                                            x2="100%"
                                            y2="100%">

                                <stop offset="0%" stop-color="#fff3a6"/>

                                <stop offset="20%" stop-color="#ffd700"/>

                                <stop offset="45%" stop-color="#f5b400"/>

                                <stop offset="70%" stop-color="#c88600"/>

                                <stop offset="88%" stop-color="#ffd84d"/>

                                <stop offset="100%" stop-color="#a96800"/>

                            </linearGradient>


                            <!-- Dark Gold -->

                            <linearGradient id="darkGold"
                                            x1="0%"
                                            y1="0%"
                                            x2="100%"
                                            y2="100%">

                                <stop offset="0%" stop-color="#9b6200"/>

                                <stop offset="50%" stop-color="#f6c438"/>

                                <stop offset="100%" stop-color="#7d4c00"/>

                            </linearGradient>


                            <!-- Shine -->

                            <linearGradient id="shineGradient"
                                            x1="0%"
                                            y1="0%"
                                            x2="100%"
                                            y2="0%">

                                <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>

                                <stop offset="45%" stop-color="#ffffff" stop-opacity="0.1"/>

                                <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>

                                <stop offset="55%" stop-color="#ffffff" stop-opacity="0.1"/>

                                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>

                            </linearGradient>


                            <!-- Glow -->

                            <filter id="trophyGlow">

                                <feGaussianBlur
                                    stdDeviation="3"
                                    result="blur"/>

                                <feMerge>

                                    <feMergeNode in="blur"/>

                                    <feMergeNode in="SourceGraphic"/>

                                </feMerge>

                            </filter>


                            <!-- Shine Clip -->

                            <clipPath id="cupClip">

                                <path d="M52 42
                                         L168 42
                                         L158 112
                                         C155 136 139 151 126 158
                                         L94 158
                                         C81 151 65 136 62 112
                                         Z"/>

                            </clipPath>

                        </defs>


                        <!-- Trophy Glow -->

                        <ellipse
                            cx="110"
                            cy="202"
                            rx="55"
                            ry="7"
                            fill="#f4b400"
                            opacity="0.25"
                            filter="url(#trophyGlow)">

                        </ellipse>


                        <!-- Left Handle -->

                        <path
                            d="M55 48
                               C27 42 15 58 20 82
                               C24 103 39 112 60 106
                               L60 94
                               C45 99 34 91 32 77
                               C29 62 40 57 56 62"
                            fill="none"
                            stroke="url(#goldTrophy)"
                            stroke-width="10"
                            stroke-linecap="round">

                        </path>


                        <!-- Right Handle -->

                        <path
                            d="M165 48
                               C193 42 205 58 200 82
                               C196 103 181 112 160 106
                               L160 94
                               C175 99 186 91 188 77
                               C191 62 180 57 164 62"
                            fill="none"
                            stroke="url(#goldTrophy)"
                            stroke-width="10"
                            stroke-linecap="round">

                        </path>


                        <!-- Main Trophy Cup -->

                        <path
                            d="M52 42
                               L168 42
                               L158 112
                               C155 136 139 151 126 158
                               L126 177
                               L94 177
                               L94 158
                               C81 151 65 136 62 112
                               Z"
                            fill="url(#goldTrophy)"
                            stroke="#a96c00"
                            stroke-width="3">

                        </path>


                        <!-- Top Rim -->

                        <path
                            d="M48 40
                               Q110 30 172 40
                               L168 55
                               Q110 46 52 55
                               Z"
                            fill="url(#darkGold)"
                            stroke="#9c6200"
                            stroke-width="2">

                        </path>


                        <!-- Decorative Band -->

                        <path
                            d="M59 73
                               Q110 82 161 73
                               L159 86
                               Q110 95 61 86
                               Z"
                            fill="url(#darkGold)">

                        </path>


                        <!-- Trophy Star -->

                        <path
                            d="M110 88
                               L115 101
                               L129 102
                               L118 111
                               L122 125
                               L110 117
                               L98 125
                               L102 111
                               L91 102
                               L105 101
                               Z"
                            fill="#fff1a3"
                            stroke="#b97800"
                            stroke-width="2">

                        </path>


                        <!-- Cup Highlight Details -->

                        <path
                            d="M76 58 L82 127"
                            stroke="#fff0a0"
                            stroke-width="4"
                            opacity="0.65">

                        </path>

                        <path
                            d="M91 59 L96 143"
                            stroke="#fff0a0"
                            stroke-width="3"
                            opacity="0.5">

                        </path>

                        <path
                            d="M144 58 L138 127"
                            stroke="#9b6100"
                            stroke-width="4"
                            opacity="0.5">

                        </path>

                        <path
                            d="M129 59 L124 143"
                            stroke="#9b6100"
                            stroke-width="3"
                            opacity="0.4">

                        </path>


                        <!-- Trophy Stem -->

                        <path
                            d="M94 153
                               Q110 163 126 153
                               L126 180
                               Q110 187 94 180
                               Z"
                            fill="url(#darkGold)">

                        </path>


                        <!-- Trophy Base -->

                        <path
                            d="M82 178
                               Q110 170 138 178
                               L148 194
                               Q110 204 72 194
                               Z"
                            fill="url(#goldTrophy)"
                            stroke="#9d6300"
                            stroke-width="3">

                        </path>


                        <!-- Base Shadow -->

                        <ellipse
                            cx="110"
                            cy="194"
                            rx="39"
                            ry="9"
                            fill="#8b5600"
                            opacity="0.45">

                        </ellipse>


                        <!-- Animated Shine -->

                        <rect
                            class="trophy-shine"
                            x="50"
                            y="40"
                            width="120"
                            height="125"
                            fill="url(#shineGradient)"
                            clip-path="url(#cupClip)">

                        </rect>

                    </svg>

                </span>

                Leadership Board

            </h1>


            <!-- Top 3 Students -->

            <div class="top-leaders">

                <!-- Second Position -->

                <div class="leader-card">

                    <div class="leader-rank">
                        🥈
                    </div>

                    <div class="leader-icon">
                        <i class="bi bi-person-circle"></i>
                    </div>

                    <div class="leader-name">
                        Student 2
                    </div>

                    <div class="leader-marks">
                        850 Marks
                    </div>

                    <div class="leader-attendance">
                        92% Attendance
                    </div>

                </div>


                <!-- First Position -->

                <div class="leader-card first">

                    <div class="leader-rank">
                        🥇
                    </div>

                    <div class="leader-icon">
                        <i class="bi bi-person-circle"></i>
                    </div>

                    <div class="leader-name">
                        Student 1
                    </div>

                    <div class="leader-marks">
                        950 Marks
                    </div>

                    <div class="leader-attendance">
                        96% Attendance
                    </div>

                </div>


                <!-- Third Position -->

                <div class="leader-card">

                    <div class="leader-rank">
                        🥉
                    </div>

                    <div class="leader-icon">
                        <i class="bi bi-person-circle"></i>
                    </div>

                    <div class="leader-name">
                        Student 3
                    </div>

                    <div class="leader-marks">
                        800 Marks
                    </div>

                    <div class="leader-attendance">
                        89% Attendance
                    </div>

                </div>

            </div>


            <!-- Ranking Table -->

            <div class="ranking-card">

                <div class="ranking-title">
                    Student Rankings
                </div>


                <table class="ranking-table">

                    <thead>

                        <tr>

                            <th>Rank</th>

                            <th>Student</th>

                            <th>Marks</th>

                            <th>Attendance</th>

                        </tr>

                    </thead>


                    <tbody>

                        <!-- Rank 1 -->

                        <tr>

                            <td class="rank-number">
                                1
                            </td>

                            <td class="student-name">
                                Student 1
                            </td>

                            <td class="student-marks">
                                950
                            </td>

                            <td class="student-attendance">
                                96%
                            </td>

                        </tr>


                        <!-- Rank 2 -->

                        <tr>

                            <td class="rank-number">
                                2
                            </td>

                            <td class="student-name">
                                Student 2
                            </td>

                            <td class="student-marks">
                                850
                            </td>

                            <td class="student-attendance">
                                92%
                            </td>

                        </tr>


                        <!-- Rank 3 -->

                        <tr>

                            <td class="rank-number">
                                3
                            </td>

                            <td class="student-name">
                                Student 3
                            </td>

                            <td class="student-marks">
                                800
                            </td>

                            <td class="student-attendance">
                                89%
                            </td>

                        </tr>


                        <!-- Rank 4 -->

                        <tr>

                            <td class="rank-number">
                                4
                            </td>

                            <td class="student-name">
                                Student 4
                            </td>

                            <td class="student-marks">
                                750
                            </td>

                            <td class="student-attendance">
                                94%
                            </td>

                        </tr>


                        <!-- Rank 5 -->

                        <tr>

                            <td class="rank-number">
                                5
                            </td>

                            <td class="student-name">
                                Student 5
                            </td>

                            <td class="student-marks">
                                700
                            </td>

                            <td class="student-attendance">
                                87%
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- Footer -->

        <div th:replace="~{fragments/layout :: footer}"></div>

    </div>

</div>


<!-- Scripts -->

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
