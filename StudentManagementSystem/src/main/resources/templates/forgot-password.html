<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="login-body">

<div class="card login-card" style="width: 100%; max-width: 460px;">

    <div class="login-header text-center text-white">
        <h2 class="mb-1 fw-bold">
            <i class="bi bi-key-fill me-2"></i>
            Forgot Password
        </h2>
        <p class="mb-0 opacity-75">Reset your account password</p>
    </div>

    <div class="card-body p-4 p-md-5">

        <!-- SUCCESS MESSAGE -->
        <div th:if="${message}"
             class="alert alert-info"
             th:text="${message}">
        </div>

        <!-- ERROR MESSAGE -->
        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <p class="text-muted small text-center mb-4">
            Enter the email address you used to sign up.
            We'll send you a link to reset your password.
        </p>

        <form th:action="@{/forgot-password}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="mb-4">
                <label for="email" class="form-label text-muted small fw-bold">
                    EMAIL ADDRESS
                </label>
                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>
                    <input type="email"
                           class="form-control border-start-0 ps-0"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           autocomplete="email"
                           required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary py-2">
                    <i class="bi bi-send me-1"></i>
                    Send Reset Link
                </button>
            </div>

            <div class="text-center">
                <a th:href="@{/login}"
                   class="text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Login
                </a>
            </div>

        </form>

    </div>

</div>

</body>

</html>
