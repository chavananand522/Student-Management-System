<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}"></head>

<body>

    <div class="d-flex" id="wrapper">

        <!-- Sidebar -->
        <div th:replace="~{fragments/layout::sidebar}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">

            <div th:replace="~{fragments/layout::navbar}"></div>

            <div class="container-fluid px-4 py-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Students</h2>
                    <a th:href="@{/students/new}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> Add New Student
                    </a>
                </div>

                <div th:if="${message}"
                     class="alert alert-success text-center"
                     role="alert"
                     th:text="${message}">
                </div>

                <div class="card mb-4">

                    <div class="card-header bg-white">
                        <i class="bi bi-table me-1"></i> Student List
                    </div>

                    <div class="card-body">

                        <div class="text-muted"
                             th:if="${students.content.isEmpty()}">
                            No Course Found
                        </div>

                        <div class="table-responsive"
                             th:if="${!students.content.isEmpty()}">

                            <table class="table table-hover table-striped align-middle">

                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Phone</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>

                                <tbody>

                                    <tr th:each="student : ${students.content}">

                                        <td data-label="ID"
                                            th:text="${student.id}">
                                        </td>

                                        <td data-label="Name"
                                            th:text="|${student.firstName} ${student.lastName}|">
                                        </td>

                                        <td data-label="Email"
                                            th:text="${student.email}">
                                        </td>

                                        <td data-label="Phone"
                                            th:text="${student.phoneNumber}">
                                        </td>

                                        <td data-label="Actions">
                                            <!-- UPDATED ACTION BUTTONS (View, Edit, Delete) -->
                                            <div class="d-flex gap-2">
                                                
                                                <!-- View Button (Blue Outline Eye) -->
                                                <a th:href="@{/students/{id}(id=${student.id})}"
                                                   class="btn btn-sm btn-outline-primary d-flex align-items-center justify-content-center"
                                                   style="width: 36px; height: 36px; border-radius: 8px;"
                                                   title="View">
                                                    <i class="bi bi-eye fs-6"></i>
                                                </a>

                                                <!-- Edit Button (Yellow Outline Pencil) -->
                                                <a th:href="@{/students/{id}/edit(id=${student.id})}"
                                                   class="btn btn-sm btn-outline-warning text-warning d-flex align-items-center justify-content-center"
                                                   style="width: 36px; height: 36px; border-radius: 8px;"
                                                   title="Edit">
                                                    <i class="bi bi-pencil fs-6"></i>
                                                </a>

                                                <!-- Delete Button (Red Outline Trash) -->
                                                <form th:action="@{'/students/delete/' + ${student.id}}" method="post" class="d-inline">
                                                    <button type="submit"
                                                            class="btn btn-sm btn-outline-danger d-flex align-items-center justify-content-center"
                                                            style="width: 36px; height: 36px; border-radius: 8px;"
                                                            title="Delete"
                                                            onclick="return confirm('Are you sure you want to delete this student?');">
                                                        <i class="bi bi-trash fs-6"></i>
                                                    </button>
                                                </form>

                                            </div>
                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                        <nav aria-label="Student pagination"
                             th:if="${students.totalPages > 1}">

                            <ul class="pagination justify-content-end">

                                <!-- Previous -->
                                <li class="page-item"
                                    th:classappend="${students.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/students/list(page=${students.first ? 0 : students.number - 1}, size=${students.size})}">
                                        Previous
                                    </a>
                                </li>

                                <!-- Page numbers -->
                                <li class="page-item"
                                    th:each="pageNum : ${#numbers.sequence(0, students.totalPages - 1)}"
                                    th:classappend="${pageNum == students.number} ? 'active'">
                                    <a class="page-link"
                                       th:href="@{/students/list(page=${pageNum}, size=${students.size})}"
                                       th:text="${pageNum + 1}">
                                    </a>
                                </li>

                                <!-- Next -->
                                <li class="page-item"
                                    th:classappend="${students.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/students/list(page=${students.number + 1}, size=${students.size})}">
                                        Next
                                    </a>
                                </li>

                            </ul>

                        </nav>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div th:replace="~{fragments/layout::scripts}"></div>

</body>

</html>
