<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}"></head>

<body>

<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout::sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <div th:replace="~{fragments/layout::navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <!-- Header -->
            <div class="bg-primary text-white rounded-3 p-4 mb-4">
                <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3">
                    <div>
                        <h2 class="mb-1">Students Enrolled in Courses</h2>
                        <p class="mb-0 opacity-75">
                            Track enrollment coverage, fees, and quick access to details.
                        </p>
                    </div>
                    <a href="/enrollments/showEnroll"
                       class="btn btn-light text-primary fw-semibold">
                        <i class="bi bi-plus-lg me-1"></i>
                        Enroll Student
                    </a>
                </div>
            </div>

            <!-- Success Message -->
            <div th:if="${message}"
                 class="alert alert-success text-center"
                 role="alert"
                 th:text="${message}">
            </div>

            <!-- Error Message -->
            <div th:if="${error}"
                 class="alert alert-danger text-center"
                 role="alert"
                 th:text="${error}">
            </div>

            <!-- Enrolled Students Card -->
            <div class="card mb-4">

                <div class="card-header bg-white">
                    <i class="bi bi-table me-1"></i>
                    Enrolled Students
                </div>

                <div class="card-body">

                    <!-- No Records -->
                    <div class="text-muted"
                         th:if="${students.content.isEmpty()}">
                        No Course Found
                    </div>

                    <!-- Student Table -->
                    <div class="table-responsive"
                         th:if="${!students.content.isEmpty()}">

                        <table class="table table-hover table-striped align-middle">

                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Student Name</th>
                                    <th>Email</th>
                                    <th>Courses Count</th>
                                    <th>Total Fee</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="student, stat : ${students.content}">

                                    <td th:text="${students.totalElements - (students.number * students.size) - stat.index}">
                                    </td>

                                    <td data-label="Student Name"
                                        th:text="${student.studentName}"></td>

                                    <td data-label="Email"
                                        th:text="${student.email}"></td>

                                    <td data-label="Courses Count"
                                        th:text="${student.courseCount}"></td>

                                    <td data-label="Total Fee"
                                        th:text="${student.totalFee}"></td>

                                    <td data-label="Actions">

                                        <div class="d-flex gap-2">

                                            <!-- View Button (Blue Outline Eye) -->
                                            <a th:href="@{/enrollments/getStudentEnrollmentDetails/{id}(id=${student.studentId}, source='enrollments')}"
                                               class="btn btn-sm btn-outline-primary d-flex align-items-center justify-content-center"
                                               style="width: 36px; height: 36px; border-radius: 8px;"
                                               title="View">
                                                <i class="bi bi-eye fs-6"></i>
                                            </a>

                                            <!-- Edit Button (Yellow Outline Pencil)
                                                 Opens the enroll form for this student -->
                                            <a th:href="@{/enrollments/edit/{id}(id=${student.studentId})}"
                                               class="btn btn-sm btn-outline-warning text-warning d-flex align-items-center justify-content-center"
                                               style="width: 36px; height: 36px; border-radius: 8px;"
                                               title="Edit">
                                                <i class="bi bi-pencil fs-6"></i>
                                            </a>

                                            <!-- Delete Button (Red Outline Trash)
                                                 Deletes ALL enrollments for this student -->
                                            <form th:action="@{'/enrollments/deleteByStudent/' + ${student.studentId}}"
                                                  method="post"
                                                  class="d-inline">
                                                <button type="submit"
                                                        class="btn btn-sm btn-outline-danger d-flex align-items-center justify-content-center"
                                                        style="width: 36px; height: 36px; border-radius: 8px;"
                                                        title="Delete"
                                                        onclick="return confirm('Delete all enrollments for this student?');">
                                                    <i class="bi bi-trash fs-6"></i>
                                                </button>
                                            </form>

                                        </div>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                    <!-- Pagination -->
                    <nav aria-label="Course pagination"
                         th:if="${students.totalPages > 1}">

                        <ul class="pagination justify-content-end">

                            <li class="page-item"
                                th:classappend="${students.first} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{'/enrollments/enrollmentList'(page=${students.number - 1}, size=${students.size})}">
                                    Previous
                                </a>
                            </li>

                            <li class="page-item"
                                th:each="pageNum : ${#numbers.sequence(0, students.totalPages - 1)}"
                                th:classappend="${pageNum == students.number} ? 'active'">
                                <a class="page-link"
                                   th:href="@{'/enrollments/enrollmentList'(page=${pageNum}, size=${students.size})}"
                                   th:text="${pageNum + 1}">
                                </a>
                            </li>

                            <li class="page-item"
                                th:classappend="${students.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{'/enrollments/enrollmentList'(page=${students.number + 1}, size=${students.size})}">
                                    Next
                                </a>
                            </li>

                        </ul>

                    </nav>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Layout Scripts -->
<div th:replace="~{fragments/layout::scripts}"></div>

</body>

</html>
