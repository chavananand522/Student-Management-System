<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}">
</head>

<body>

<div class="d-flex" id="wrapper">

    <!-- ================================================= -->
    <!-- SIDEBAR -->
    <!-- ================================================= -->

    <div th:replace="~{fragments/layout::sidebar}">
    </div>


    <!-- ================================================= -->
    <!-- PAGE CONTENT -->
    <!-- ================================================= -->

    <div id="page-content-wrapper">

        <!-- ================================================= -->
        <!-- NAVBAR -->
        <!-- ================================================= -->

        <div th:replace="~{fragments/layout::navbar}">
        </div>


        <!-- ================================================= -->
        <!-- MAIN CONTENT -->
        <!-- ================================================= -->

        <div class="container-fluid px-4 py-4">


            <!-- ================================================= -->
            <!-- SUCCESS MESSAGE -->
            <!-- ================================================= -->

            <div th:if="${message}"
                 class="alert alert-success text-center"
                 role="alert"
                 th:text="${message}">

                Module is created successfully

            </div>


            <!-- ================================================= -->
            <!-- SUBJECT HEADER -->
            <!-- ================================================= -->

            <div class="card border-0 shadow-sm mb-4">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center">


                        <!-- ================================================= -->
                        <!-- SUBJECT INFORMATION -->
                        <!-- ================================================= -->

                        <div>

                            <!-- Breadcrumb -->

                            <div class="mb-2">

                                <a th:href="@{/study}"
                                   class="text-primary text-decoration-none">

                                    Study

                                </a>

                                <span class="mx-2">
                                    ›
                                </span>

                                <span th:text="${subjectName}">
                                    Physics
                                </span>

                            </div>


                            <!-- Subject Name -->

                            <h1 class="fw-bold mb-1"
                                th:text="${subjectName}">

                                Physics

                            </h1>


                            <!-- Subject Description -->

                            <p class="text-muted mb-0">

                                Explore modules, concepts and previous year questions

                            </p>

                        </div>


                        <!-- ================================================= -->
                        <!-- SUBJECT ICON -->
                        <!-- ================================================= -->

                        <div class="d-flex align-items-center justify-content-center"
                             style="width:52px;
                                    height:52px;
                                    background:#eaf2ff;
                                    border-radius:14px;">


                            <!-- PHYSICS -->

                            <i th:if="${'Physics'.equalsIgnoreCase(subjectName)}"
                               class="bi bi-atom fs-3 text-primary">
                            </i>


                            <!-- CHEMISTRY -->

                            <i th:if="${'Chemistry'.equalsIgnoreCase(subjectName)}"
                               class="bi bi-flask fs-3 text-primary">
                            </i>


                            <!-- BIOLOGY -->

                            <i th:if="${'Biology'.equalsIgnoreCase(subjectName)}"
                               class="bi bi-heart-pulse fs-3 text-primary">
                            </i>

                        </div>

                    </div>

                </div>

            </div>



            <!-- ================================================= -->
            <!-- MODULE HEADER -->
            <!-- ================================================= -->

            <div class="d-flex justify-content-between align-items-center mb-3">

                <div>

                    <h3 class="fw-bold mb-1"
                        th:text="${subjectName + ' Modules'}">

                        Physics Modules

                    </h3>

                    <p class="text-muted mb-0">

                        Select a module to start learning

                    </p>

                </div>


                <!-- ================================================= -->
                <!-- ADD NEW MODULE -->
                <!-- ================================================= -->

                <a th:href="@{/module/new(subject=${subjectName})}"
                   class="btn btn-primary">

                    <i class="bi bi-plus-lg me-1"></i>

                    Add New Module

                </a>

            </div>



            <!-- ================================================= -->
            <!-- NO MODULES -->
            <!-- ================================================= -->

            <div th:if="${modules == null || modules.isEmpty()}"
                 class="card border-0 shadow-sm">

                <div class="card-body text-center py-4">

                    <p class="text-muted mb-0">

                        No modules available for this subject.

                    </p>

                </div>

            </div>



            <!-- ================================================= -->
            <!-- MODULE LIST -->
            <!-- ================================================= -->

            <div th:if="${modules != null && !modules.isEmpty()}">

                <div class="row g-3">


                    <!-- ================================================= -->
                    <!-- EACH MODULE -->
                    <!-- ================================================= -->

                    <div class="col-12"
                         th:each="module : ${modules}">

                        <div class="card border-0 shadow-sm">

                            <div class="card-body">

                                <div class="d-flex justify-content-between align-items-center">


                                    <!-- ================================================= -->
                                    <!-- MODULE INFORMATION -->
                                    <!-- ================================================= -->

                                    <div>


                                        <!-- MODULE NUMBER -->

                                        <div class="d-flex align-items-center mb-2">

                                            <span class="badge bg-primary me-2"
                                                  th:text="${'Module ' + module.moduleNumber}">

                                                Module 1

                                            </span>

                                        </div>


                                        <!-- MODULE NAME -->

                                        <h5 class="fw-bold mb-1"
                                            th:text="${module.name}">

                                            Units and Measurements

                                        </h5>

                                    </div>



                                    <!-- ================================================= -->
                                    <!-- ACTION BUTTONS -->
                                    <!-- ================================================= -->

                                    <div class="d-flex gap-2">


                                        <!-- ================================================= -->
                                        <!-- VIEW -->
                                        <!-- ================================================= -->

                                        <a th:href="@{/module/{id}(id=${module.id})}"
                                           class="btn btn-sm btn-info text-white"
                                           title="View">

                                            <i class="bi bi-eye"></i>

                                        </a>


                                        <!-- ================================================= -->
                                        <!-- EDIT -->
                                        <!-- ================================================= -->

                                        <a th:href="@{/module/{id}/edit(id=${module.id})}"
                                           class="btn btn-sm btn-warning text-white"
                                           title="Edit">

                                            <i class="bi bi-pencil"></i>

                                        </a>


                                        <!-- ================================================= -->
                                        <!-- DELETE -->
                                        <!-- ================================================= -->

                                        <form th:action="@{/module/{id}/delete(id=${module.id})}"
                                              method="post"
                                              style="display:inline;">

                                            <button type="submit"
                                                    class="btn btn-sm btn-danger"
                                                    title="Delete"
                                                    onclick="return confirm('Are you sure you want to delete this module?');">

                                                <i class="bi bi-trash"></i>

                                            </button>

                                        </form>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


        </div>

    </div>

</div>



<!-- ================================================= -->
<!-- SCRIPTS -->
<!-- ================================================= -->

<div th:replace="~{fragments/layout::scripts}">
</div>


</body>

</html>
