<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
</head>
<body>
<div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}">
    </div>
    <!-- Page Content -->
    <div id="page-content-wrapper">
        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}">
        </div>
        <!-- ================================================= -->
        <!-- AI ASSISTANT -->
        <!-- ================================================= -->
        <main class="ai-page">
            <div class="ai-container">
                <div class="ai-card">
                    <!-- AI Header -->
                    <div class="ai-header">
                        <div class="ai-icon">
                            <i class="bi bi-robot"></i>
                        </div>
                        <div>
                            <h4>AI Assistant</h4>
                            <p>Powered by Ollama & Qwen3</p>
                        </div>
                    </div>
                    <!-- Chat -->
                    <div id="chatBox" class="chat-box">
                        <div class="message ai">
                            <div class="message-content">
                                <p>Hello! 👋</p>
                                <p>I am your AI Assistant. How can I help you?</p>
                            </div>
                        </div>
                    </div>
                    <!-- Input -->
                    <div class="input-area">
                        <div id="typing" class="typing">
                            AI is thinking...
                        </div>
                        <div class="input-group">
                            <input type="text"
                                   id="messageInput"
                                   class="form-control"
                                   placeholder="Ask something..."
                                   autocomplete="off">
                            <button type="button"
                                    id="sendButton"
                                    class="btn btn-dark send-btn">
                                <i class="bi bi-send"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <!-- Footer -->
        <div th:replace="~{fragments/layout :: footer}">
        </div>
    </div>
</div>

<!-- 🔴 CHANGED: Bootstrap JS required for Study collapse and Profile dropdown -->
<div th:replace="~{fragments/layout :: scripts}"></div>

<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- DOMPurify -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<script>
    const messageInput =
        document.getElementById("messageInput");

    const chatBox =
        document.getElementById("chatBox");

    const typing =
        document.getElementById("typing");

    const sendButton =
        document.getElementById("sendButton");

    /*
     * Enter key
     */
    messageInput.addEventListener(
        "keydown",
        function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        }
    );

    /*
     * Send button
     */
    sendButton.addEventListener(
        "click",
        sendMessage
    );

    /*
     * Send message
     */
    async function sendMessage() {
        const message =
            messageInput.value.trim();

        if (!message) {
            return;
        }

        addMessage(
            message,
            "user"
        );

        messageInput.value = "";

        typing.style.display = "block";

        sendButton.disabled = true;

        const aiMessage =
            createAIMessage();

        try {
            const csrfMeta =
                document.querySelector(
                    'meta[name="_csrf"]'
                );

            const csrfHeaderMeta =
                document.querySelector(
                    'meta[name="_csrf_header"]'
                );

            const headers = {
                "Content-Type":
                    "application/json",
                "Accept":
                    "text/event-stream"
            };

            /*
             * Add CSRF only when Spring Security
             * provides the meta tags.
             */
            if (
                csrfMeta &&
                csrfHeaderMeta
            ) {
                headers[
                    csrfHeaderMeta.content
                ] = csrfMeta.content;
            }

            const response =
                await fetch(
                    "/ai-assistant/chat",
                    {
                        method: "POST",
                        headers: headers,
                        body: JSON.stringify({
                            message: message
                        })
                    }
                );

            if (!response.ok) {
                const errorText =
                    await response.text();

                console.error(
                    "Server Error:",
                    response.status,
                    errorText
                );

                throw new Error(
                    "Server error: " +
                    response.status
                );
            }

            if (!response.body) {
                throw new Error(
                    "Streaming is not supported."
                );
            }

            typing.style.display = "none";

            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder();

            let buffer = "";

            while (true) {
                const result =
                    await reader.read();

                if (result.done) {
                    break;
                }

                buffer +=
                    decoder.decode(
                        result.value,
                        {
                            stream: true
                        }
                    );

                const events =
                    buffer.split("\n\n");

                buffer =
                    events.pop();

                for (
                    const event of events
                ) {
                    const lines =
                        event.split("\n");

                    for (
                        const line of lines
                    ) {
                        if (
                            line.startsWith("data:")
                        ) {
                            const text =
                                line.substring(5);

                            appendAIText(
                                aiMessage,
                                text
                            );
                        }
                    }
                }

                chatBox.scrollTop =
                    chatBox.scrollHeight;
            }

            /*
             * Process remaining event
             */
            if (
                buffer &&
                buffer.startsWith("data:")
            ) {
                const text =
                    buffer.substring(5);

                appendAIText(
                    aiMessage,
                    text
                );
            }

        }
        catch (error) {
            console.error(
                "AI Assistant Error:",
                error
            );

            typing.style.display =
                "none";

            aiMessage.textContent =
                "Error: " +
                error.message;

        }
        finally {
            typing.style.display =
                "none";

            sendButton.disabled =
                false;

            messageInput.focus();
        }
    }

    /*
     * Add user / AI message
     */
    function addMessage(
        message,
        type
    ) {
        const messageDiv =
            document.createElement("div");

        messageDiv.className =
            "message " + type;

        const contentDiv =
            document.createElement("div");

        contentDiv.className =
            "message-content";

        contentDiv.textContent =
            message;

        messageDiv.appendChild(
            contentDiv
        );

        chatBox.appendChild(
            messageDiv
        );

        chatBox.scrollTop =
            chatBox.scrollHeight;
    }

    /*
     * Create AI message
     */
    function createAIMessage() {
        const messageDiv =
            document.createElement("div");

        messageDiv.className =
            "message ai";

        const contentDiv =
            document.createElement("div");

        contentDiv.className =
            "message-content";

        contentDiv.dataset.content =
            "";

        messageDiv.appendChild(
            contentDiv
        );

        chatBox.appendChild(
            messageDiv
        );

        chatBox.scrollTop =
            chatBox.scrollHeight;

        return contentDiv;
    }

    /*
     * Append streaming AI text
     */
    function appendAIText(
        element,
        text
    ) {
        element.dataset.content =
            (
                element.dataset.content || ""
            ) + text;

        element.innerHTML =
            DOMPurify.sanitize(
                marked.parse(
                    element.dataset.content
                )
            );

        chatBox.scrollTop =
            chatBox.scrollHeight;
    }
</script>

<!-- ========================================================= -->
<!-- AI ASSISTANT CSS -->
<!-- ========================================================= -->

<style>
    .ai-page {
        min-height: calc(100vh - 70px);
        padding: 30px;
        background: #f5f6fa;
    }

    .ai-container {
        width: 100%;
        margin: 0 auto;
    }

    .ai-card {
        background: #ffffff;
        border-radius: 15px;
        box-shadow:
            0 4px 15px rgba(0, 0, 0, 0.08);
        overflow: hidden;
    }

    .ai-header {
        background: #1e2129;
        color: #ffffff;
        padding: 20px 25px;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .ai-icon {
        width: 50px;
        height: 50px;
        min-width: 50px;
        border-radius: 50%;
        background: #343741;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .ai-icon i {
        font-size: 26px;
    }

    .ai-header h4 {
        margin: 0;
        font-size: 24px;
    }

    .ai-header p {
        margin: 4px 0 0;
        font-size: 13px;
        color: #c7c9ce;
    }

    .chat-box {
        height: 500px;
        overflow-y: auto;
        padding: 25px;
        background: #f8f9fb;
        scroll-behavior: smooth;
    }

    .message {
        display: flex;
        width: 100%;
        margin-bottom: 18px;
    }

    .message.user {
        justify-content: flex-end;
    }

    .message.ai {
        justify-content: flex-start;
    }

    .message-content {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 12px;
        line-height: 1.6;
        font-size: 16px;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    .message.ai .message-content {
        background: #ffffff;
        border: 1px solid #e2e4e8;
        color: #222222;
    }

    .message.user .message-content {
        background: #1e2129;
        color: #ffffff;
    }

    .message-content p {
        margin-top: 0;
        margin-bottom: 14px;
    }

    .message-content p:last-child {
        margin-bottom: 0;
    }

    .message-content strong {
        font-weight: 600;
    }

    .message-content ul,
    .message-content ol {
        margin-top: 8px;
        margin-bottom: 14px;
        padding-left: 25px;
    }

    .message-content li {
        margin-bottom: 6px;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3,
    .message-content h4 {
        margin-top: 12px;
        margin-bottom: 10px;
    }

    .message-content code {
        background: #f1f1f1;
        padding: 2px 5px;
        border-radius: 4px;
        font-size: 14px;
    }

    .message-content pre {
        background: #1e2129;
        color: #ffffff;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
    }

    .message-content pre code {
        background: transparent;
        padding: 0;
        color: #ffffff;
    }

    .input-area {
        padding: 18px;
        background: #ffffff;
        border-top: 1px solid #e5e5e5;
    }

    .input-group input {
        border-radius: 10px 0 0 10px;
        padding: 13px;
    }

    .send-btn {
        border-radius: 0 10px 10px 0;
        padding: 0 22px;
    }

    .send-btn i {
        font-size: 18px;
    }

    .typing {
        color: #777777;
        font-size: 14px;
        display: none;
        margin-bottom: 10px;
    }

    .chat-box::-webkit-scrollbar {
        width: 7px;
    }

    .chat-box::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    .chat-box::-webkit-scrollbar-thumb {
        background: #c5c5c5;
        border-radius: 10px;
    }

    @media (max-width: 768px) {
        .ai-page {
            padding: 20px 15px;
        }

        .chat-box {
            height: 450px;
        }

        .message-content {
            max-width: 85%;
        }

        .ai-header h4 {
            font-size: 21px;
        }
    }
</style>

</body>
</html>
