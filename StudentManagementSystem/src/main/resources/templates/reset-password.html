<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="login-body">

<div class="card login-card" style="width: 100%; max-width: 460px;">

    <div class="login-header text-center text-white">
        <h2 class="mb-1 fw-bold">
            <i class="bi bi-shield-lock-fill me-2"></i>
            Set New Password
        </h2>
        <p class="mb-0 opacity-75">Choose a new password for your account</p>
    </div>

    <div class="card-body p-4 p-md-5">

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/reset-password}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">
                    NEW PASSWORD
                </label>
                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input type="password"
                           class="form-control border-start-0 ps-0"
                           name="newPassword"
                           autocomplete="new-password"
                           minlength="6"
                           required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">
                    CONFIRM PASSWORD
                </label>
                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="bi bi-lock-fill text-muted"></i>
                    </span>
                    <input type="password"
                           class="form-control border-start-0 ps-0"
                           name="confirmPassword"
                           autocomplete="new-password"
                           minlength="6"
                           required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary py-2">
                    <i class="bi bi-check2-circle me-1"></i>
                    Reset Password
                </button>
            </div>

            <div class="text-center">
                <a th:href="@{/login}"
                   class="text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Login
                </a>
            </div>

        </form>

    </div>

</div>

</body>

</html>
