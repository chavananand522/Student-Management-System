<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{student/student-layout::head}">
    <title>My Courses</title>
</head>

<body>

<div class="d-flex student-layout">

    <!-- SIDEBAR -->
    <div th:replace="~{student/student-layout::sidebar}"></div>

    <!-- CONTENT -->
    <div class="student-content">

        <!-- NAVBAR -->
        <div th:replace="~{student/student-layout::navbar}"></div>

        <!-- ALERTS -->
        <div th:replace="~{student/student-layout::alerts}"></div>

        <!-- MAIN -->
        <div class="container-fluid p-0">

            <div class="courses-page">

                <!-- =========================================
                     PAGE HEADER
                ========================================== -->

                <div class="courses-header">

                    <div class="courses-header-left">

                        <div class="courses-header-icon">
                            <i class="fas fa-graduation-cap"></i>
                        </div>

                        <div>

                            <h1>My Courses</h1>

                            <p>
                                All the courses you are currently enrolled in
                            </p>

                        </div>

                    </div>

                    <div class="courses-header-right">

                        <div class="courses-count-badge">
                            <i class="fas fa-book me-2"></i>
                            <span th:text="${enrollments != null ? enrollments.size() : 0}">0</span>
                            Course(s)
                        </div>

                    </div>

                </div>

                <!-- =========================================
                     COURSES GRID
                ========================================== -->

                <div class="courses-grid"
                     th:if="${enrollments != null and !enrollments.isEmpty()}">

                    <div class="course-card"
                         th:each="enrollment, iter : ${enrollments}">

                        <!-- CARD HEADER -->

                        <div class="course-card-header">

                            <div class="course-card-index"
                                 th:text="${iter.index + 1}">
                                1
                            </div>

                            <div class="course-card-badges">

                                <span class="badge-code"
                                      th:text="${enrollment.course != null ? enrollment.course.courseCode : 'N/A'}">
                                    CODE
                                </span>

                                <span class="badge-status">
                                    <i class="fas fa-circle me-1"></i>
                                    Enrolled
                                </span>

                            </div>

                        </div>

                        <!-- CARD BODY -->

                        <div class="course-card-body">

                            <h3 class="course-name"
                                th:text="${enrollment.course != null ? enrollment.course.courseName : 'Course'}">
                                Course Name
                            </h3>

                            <p class="course-desc"
                               th:text="${enrollment.course != null and enrollment.course.description != null ? enrollment.course.description : 'No description available.'}">
                                No description available.
                            </p>

                            <!-- META ROW -->

                            <div class="course-meta">

                                <div class="meta-item">

                                    <i class="fas fa-clock"></i>

                                    <div>
                                        <div class="meta-label">Duration</div>
                                        <div class="meta-value"
                                             th:text="${enrollment.course != null and enrollment.course.duration != null ? enrollment.course.duration : '—'}">
                                            —
                                        </div>
                                    </div>

                                </div>

                                <div class="meta-item">

                                    <i class="fas fa-calendar-check"></i>

                                    <div>
                                        <div class="meta-label">Enrolled On</div>
                                        <div class="meta-value"
                                             th:text="${enrollment.enrolledDate != null ? #temporals.format(enrollment.enrolledDate, 'dd MMM yyyy') : '—'}">
                                            —
                                        </div>
                                    </div>

                                </div>

                                <div class="meta-item">

                                    <i class="fas fa-indian-rupee-sign"></i>

                                    <div>
                                        <div class="meta-label">Fee</div>
                                        <div class="meta-value"
                                             th:text="${enrollment.course != null and enrollment.course.fee != null ? '₹ ' + enrollment.course.fee : '—'}">
                                            —
                                        </div>
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- =========================================
                     EMPTY STATE
                ========================================== -->

                <div class="empty-state"
                     th:if="${enrollments == null or enrollments.isEmpty()}">

                    <i class="fas fa-graduation-cap"></i>

                    <h3>No Courses Yet</h3>

                    <p>
                        You are not enrolled in any course yet.
                        Please contact your administrator to get enrolled.
                    </p>

                    <a th:href="@{/student/dashboard}"
                       class="btn-empty-action">
                        <i class="fas fa-arrow-left me-1"></i>
                        Back to Dashboard
                    </a>

                </div>

            </div>

        </div>

        <!-- FOOTER -->
        <div th:replace="~{student/student-layout::footer}"></div>

    </div>

</div>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet">

<style>
    * { box-sizing: border-box; }

    .courses-page {
        width: 100%;
        max-width: 1500px;
        margin: 0 auto;
        padding: 25px;
    }

    /* =========================================================
       PAGE HEADER
    ========================================================== */

    .courses-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 18px;
        background: linear-gradient(135deg, #ffffff 0%, #f7f9ff 100%);
        border: 1px solid #e5eaf1;
        border-radius: 16px;
        padding: 24px 28px;
        margin-bottom: 28px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
    }

    .courses-header-left {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    .courses-header-icon {
        width: 62px;
        height: 62px;
        min-width: 62px;
        border-radius: 16px;
        background: linear-gradient(135deg, #4361ee, #6f8dff);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        box-shadow: 0 6px 16px rgba(67, 97, 238, 0.30);
    }

    .courses-header h1 {
        margin: 0 0 4px;
        font-size: 26px;
        font-weight: 800;
        color: #172b4d;
    }

    .courses-header p {
        margin: 0;
        color: #7b8794;
        font-size: 14px;
    }

    .courses-count-badge {
        background: #eef3ff;
        color: #4361ee;
        padding: 10px 18px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
    }

    /* =========================================================
       COURSES GRID
    ========================================================== */

    .courses-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 22px;
    }

    /* =========================================================
       COURSE CARD
    ========================================================== */

    .course-card {
        background: #ffffff;
        border: 1px solid #e9ecef;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        display: flex;
        flex-direction: column;
        transition: all 0.25s ease;
    }

    .course-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
        border-color: #cfe0ff;
    }

    /* =============================
       CARD HEADER
    ============================== */

    .course-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
        background: linear-gradient(135deg, #f9faff 0%, #eef3ff 100%);
        border-bottom: 1px solid #e5eaf1;
    }

    .course-card-index {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #4361ee;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 16px;
        box-shadow: 0 4px 10px rgba(67, 97, 238, 0.25);
    }

    .course-card-badges {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .badge-code {
        background: #ffffff;
        color: #4361ee;
        border: 1px solid #cfe0ff;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
    }

    .badge-status {
        background: #d1f7e4;
        color: #0b5f3a;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
    }

    .badge-status i {
        color: #20a568;
        font-size: 7px;
    }

    /* =============================
       CARD BODY
    ============================== */

    .course-card-body {
        padding: 22px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .course-name {
        margin: 0 0 10px;
        font-size: 19px;
        font-weight: 800;
        color: #172b4d;
        line-height: 1.3;
    }

    .course-desc {
        margin: 0 0 20px;
        color: #6c757d;
        font-size: 14px;
        line-height: 1.6;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* =============================
       META ROW
    ============================== */

    .course-meta {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: auto;
        padding-top: 18px;
        border-top: 1px solid #f0f2f5;
    }

    .meta-item {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .meta-item > i {
        width: 34px;
        height: 34px;
        min-width: 34px;
        border-radius: 10px;
        background: #f1f5ff;
        color: #4361ee;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
    }

    .meta-label {
        font-size: 11px;
        color: #7b8794;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-weight: 600;
    }

    .meta-value {
        font-size: 14px;
        color: #172b4d;
        font-weight: 600;
    }

    /* =========================================================
       EMPTY STATE
    ========================================================== */

    .empty-state {
        background: #ffffff;
        border: 1px solid #e9ecef;
        border-radius: 18px;
        padding: 70px 30px;
        text-align: center;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
    }

    .empty-state i {
        font-size: 60px;
        color: #adb5bd;
        margin-bottom: 20px;
    }

    .empty-state h3 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 800;
        color: #172b4d;
    }

    .empty-state p {
        margin: 0 auto 24px;
        max-width: 420px;
        color: #6c757d;
        font-size: 14px;
        line-height: 1.6;
    }

    .btn-empty-action {
        background: #4361ee;
        color: #ffffff;
        padding: 11px 22px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        transition: all 0.2s ease;
        box-shadow: 0 4px 10px rgba(67, 97, 238, 0.25);
    }

    .btn-empty-action:hover {
        background: #3a56d4;
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 6px 14px rgba(67, 97, 238, 0.35);
    }

    /* =========================================================
       RESPONSIVE
    ========================================================== */

    @media (max-width: 992px) {

        .courses-grid {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }
    }

    @media (max-width: 768px) {

        .courses-page { padding: 15px; }

        .courses-header {
            padding: 20px;
            flex-direction: column;
            align-items: flex-start;
        }

        .courses-header h1 { font-size: 22px; }

        .courses-header-icon {
            width: 52px;
            height: 52px;
            min-width: 52px;
            font-size: 22px;
        }

        .courses-grid {
            grid-template-columns: 1fr;
        }

        .course-card-body {
            padding: 18px;
        }

        .course-name { font-size: 17px; }
    }
</style>

<th:block th:replace="~{student/student-layout::scripts}"></th:block>

</body>
</html>
