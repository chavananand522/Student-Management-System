<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{student/student-layout::head}"></head>

<body>

<div class="d-flex student-layout">

    <div th:replace="~{student/student-layout::sidebar}"></div>

    <div class="student-content">

        <div th:replace="~{student/student-layout::navbar}"></div>

        <main class="ai-page">
            <div class="ai-container">
                <div class="ai-card">

                    <div class="ai-header">
                        <div class="ai-icon"><i class="bi bi-robot"></i></div>
                        <div>
                            <h4>AI Assistant</h4>
                            <p>Powered by Ollama & Qwen3</p>
                        </div>
                    </div>

                    <div id="chatBox" class="chat-box">
                        <div class="message ai">
                            <div class="message-content">
                                <p>Hello! 👋</p>
                                <p>I am your AI Assistant. How can I help you with your studies?</p>
                            </div>
                        </div>
                    </div>

                    <div class="input-area">
                        <div id="typing" class="typing">AI is thinking...</div>
                        <div class="input-group">
                            <input type="text" id="messageInput" class="form-control"
                                   placeholder="Ask something..." autocomplete="off">
                            <button type="button" id="sendButton" class="btn btn-dark send-btn">
                                <i class="bi bi-send"></i>
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </main>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<script>
    const messageInput = document.getElementById("messageInput");
    const chatBox = document.getElementById("chatBox");
    const typing = document.getElementById("typing");
    const sendButton = document.getElementById("sendButton");

    messageInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    });

    sendButton.addEventListener("click", sendMessage);

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        addMessage(message, "user");
        messageInput.value = "";
        typing.style.display = "block";
        sendButton.disabled = true;

        const aiMessage = createAIMessage();

        try {
            const csrfMeta = document.querySelector('meta[name="_csrf"]');
            const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');

            const headers = {
                "Content-Type": "application/json",
                "Accept": "text/event-stream"
            };
            if (csrfMeta && csrfHeaderMeta) {
                headers[csrfHeaderMeta.content] = csrfMeta.content;
            }

            const response = await fetch("/ai-assistant/chat", {
                method: "POST",
                headers: headers,
                body: JSON.stringify({ message: message })
            });

            if (!response.ok) throw new Error("Server error: " + response.status);
            if (!response.body) throw new Error("Streaming is not supported.");

            typing.style.display = "none";
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
                const result = await reader.read();
                if (result.done) break;
                buffer += decoder.decode(result.value, { stream: true });
                const events = buffer.split("\n\n");
                buffer = events.pop();
                for (const event of events) {
                    const lines = event.split("\n");
                    for (const line of lines) {
                        if (line.startsWith("data:")) {
                            appendAIText(aiMessage, line.substring(5));
                        }
                    }
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            if (buffer && buffer.startsWith("data:")) {
                appendAIText(aiMessage, buffer.substring(5));
            }
        } catch (error) {
            typing.style.display = "none";
            aiMessage.textContent = "Error: " + error.message;
        } finally {
            typing.style.display = "none";
            sendButton.disabled = false;
            messageInput.focus();
        }
    }

    function addMessage(message, type) {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message " + type;
        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content";
        contentDiv.textContent = message;
        messageDiv.appendChild(contentDiv);
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function createAIMessage() {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message ai";
        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content";
        contentDiv.dataset.content = "";
        messageDiv.appendChild(contentDiv);
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return contentDiv;
    }

    function appendAIText(element, text) {
        element.dataset.content = (element.dataset.content || "") + text;
        element.innerHTML = DOMPurify.sanitize(marked.parse(element.dataset.content));
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

<th:block th:replace="~{student/student-layout::scripts}"></th:block>

</body>
</html>
