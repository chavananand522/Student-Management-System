<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{student/student-layout::head}"></head>

<body>

<div class="d-flex student-layout">

    <div th:replace="~{student/student-layout::sidebar}"></div>

    <div class="student-content">

        <div th:replace="~{student/student-layout::navbar}"></div>

        <div th:replace="~{student/student-layout::alerts}"></div>

        <div class="container-fluid px-4 py-4">

            <!-- STUDY HOME -->
            <div th:if="${study == null}">

                <div class="study-header">
                    <div>
                        <div class="breadcrumb">
                            <a th:href="@{/student/study}">Study</a>
                        </div>
                        <h1>Study</h1>
                        <p>Choose a subject to start learning</p>
                    </div>

                    <div class="subject-icon">
                        <i class="bi bi-book"></i>
                    </div>
                </div>

                <div class="section-title">
                    <h2>Subjects</h2>
                    <p>Select a subject to view modules</p>
                </div>

                <div class="chapter-list">

                    <a th:each="subject, stat : ${subjects}"
                       th:with="subjectLower=${#strings.toLowerCase(subject.subject)}"
                       th:href="@{'/student/study/' + ${subjectLower}}"
                       class="chapter-card">

                        <div class="chapter-number" th:text="${stat.count}">1</div>

                        <div class="chapter-info">
                            <h3 th:text="${subject.subject}">Physics</h3>

                            <div class="chapter-meta">
                                <span>
                                    <i class="bi bi-book"></i>
                                    View Modules
                                </span>
                            </div>
                        </div>

                        <div class="chapter-arrow">
                            <i class="bi bi-chevron-right"></i>
                        </div>

                    </a>

                </div>

            </div>


            <!-- SUBJECT PAGE -->
            <div th:if="${study != null}"
                 th:with="subjectLower=${#strings.toLowerCase(subjectName)}">

                <div th:if="${message}"
                     class="alert alert-success text-center"
                     role="alert"
                     th:text="${message}">
                </div>

                <!-- SUBJECT HEADER -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">

                            <div>
                                <div class="mb-2">
                                    <a th:href="@{/student/study}"
                                       class="text-primary text-decoration-none">
                                        Study
                                    </a>
                                    <span class="mx-2">›</span>
                                    <span th:text="${subjectName}">Physics</span>
                                </div>

                                <h1 class="fw-bold mb-1" th:text="${subjectName}">
                                    Physics
                                </h1>

                                <p class="text-muted mb-0"
                                   th:if="${study.description != null && !study.description.isEmpty()}"
                                   th:text="${study.description}">
                                </p>
                            </div>

                            <div class="subject-icon">
                                <i th:if="${subjectName == 'Physics'}" class="bi bi-lightning-charge"></i>
                                <i th:if="${subjectName == 'Chemistry'}" class="bi bi-droplet"></i>
                                <i th:if="${subjectName == 'Biology'}" class="bi bi-heart-pulse"></i>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- MODULES HEADER -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h3 class="fw-bold mb-1"
                            th:text="${subjectName + ' Modules'}">
                        </h3>
                        <p class="text-muted mb-0">
                            Select a module to view its chapters
                        </p>
                    </div>
                </div>

                <!-- NO MODULES -->
                <div th:if="${modules == null || modules.isEmpty()}"
                     class="card border-0 shadow-sm">
                    <div class="card-body text-center py-5">
                        <i class="bi bi-journal-x fs-1 text-muted"></i>
                        <h5 class="mt-3">No Modules Found</h5>
                        <p class="text-muted mb-0">
                            No modules have been added to this subject yet.
                        </p>
                    </div>
                </div>

                <!-- MODULES LIST -->
                <div th:if="${modules != null && !modules.isEmpty()}"
                     class="chapter-container">

                    <div th:each="module : ${modules}"
                         class="chapter-row">

                        <div class="chapter-info">
                            <div class="d-flex align-items-center gap-2">
                                <span class="chapter-number-small"
                                      th:text="${module.moduleNumber}">1</span>

                                <a th:href="@{'/student/study/' + ${subjectLower} + '/module/' + ${module.id}}"
                                   class="chapter-name"
                                   th:text="${module.name}">
                                </a>
                            </div>

                            <div class="chapter-description"
                                 th:if="${module.description != null && !module.description.isEmpty()}"
                                 th:text="${module.description}">
                            </div>
                        </div>

                        <div class="chapter-actions">
                            <a th:href="@{'/student/study/' + ${subjectLower} + '/module/' + ${module.id}}"
                               class="btn btn-sm btn-outline-primary"
                               title="View">
                                <i class="bi bi-eye"></i>
                            </a>
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div th:replace="~{student/student-layout::footer}"></div>

    </div>

</div>

<th:block th:replace="~{student/student-layout::scripts}"></th:block>

</body>
</html>
