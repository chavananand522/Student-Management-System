<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{student-layout::head}">
</head>

<body>

<div class="d-flex">


    <!-- ========================================================
         SIDEBAR
    ========================================================= -->

    <div th:replace="~{student-layout::sidebar}">
    </div>


    <!-- ========================================================
         MAIN CONTENT
    ========================================================= -->

    <div class="student-content">


        <!-- ====================================================
             NAVBAR
        ===================================================== -->

        <div th:replace="~{student-layout::navbar}">
        </div>


        <!-- ====================================================
             ALERTS
        ===================================================== -->

        <div th:replace="~{student-layout::alerts}">
        </div>


        <!-- ====================================================
             DASHBOARD CONTENT
        ===================================================== -->

        <div class="container-fluid px-4 py-4">


            <!-- Welcome -->
            <div class="mb-4">

                <h2 class="fw-bold">

                    Welcome,

                    <span th:text="${student.firstName}">
                        Student
                    </span>

                </h2>

                <p class="text-muted mb-0">

                    Welcome to your Student Management System portal.

                </p>

            </div>


            <!-- =================================================
                 STAT CARDS
            ================================================== -->

            <div class="row g-4">


                <!-- =================================================
                     MY COURSES
                ================================================== -->

                <div class="col-md-6 col-xl-3">

                    <div class="card student-card h-100">

                        <div class="card-body">


                            <div class="stat-icon mb-3">

                                <i class="bi bi-book text-primary"></i>

                            </div>


                            <div class="text-muted">

                                My Courses

                            </div>


                            <h2 class="fw-bold"
                                th:text="${courseCount}">

                                0

                            </h2>


                            <a th:href="@{/student/courses}"
                               class="btn btn-sm btn-outline-primary">

                                View Courses

                            </a>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     AVAILABLE TESTS
                ================================================== -->

                <div class="col-md-6 col-xl-3">

                    <div class="card student-card h-100">

                        <div class="card-body">


                            <div class="stat-icon mb-3">

                                <i class="bi bi-pencil-square text-primary"></i>

                            </div>


                            <div class="text-muted">

                                Available Tests

                            </div>


                            <h2 class="fw-bold"
                                th:text="${testCount}">

                                0

                            </h2>


                            <a th:href="@{/student/tests}"
                               class="btn btn-sm btn-outline-primary">

                                View Tests

                            </a>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     COMPLETED TESTS
                ================================================== -->

                <div class="col-md-6 col-xl-3">

                    <div class="card student-card h-100">

                        <div class="card-body">


                            <div class="stat-icon mb-3">

                                <i class="bi bi-bar-chart text-success"></i>

                            </div>


                            <div class="text-muted">

                                Completed Tests

                            </div>


                            <h2 class="fw-bold"
                                th:text="${completedTests}">

                                0

                            </h2>


                            <a th:href="@{/student/results}"
                               class="btn btn-sm btn-outline-success">

                                My Results

                            </a>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     STUDY
                ================================================== -->

                <div class="col-md-6 col-xl-3">

                    <div class="card student-card h-100">

                        <div class="card-body">


                            <div class="stat-icon mb-3">

                                <i class="bi bi-journal-bookmark text-warning"></i>

                            </div>


                            <div class="text-muted">

                                Study

                            </div>


                            <h2 class="fw-bold">

                                Learn

                            </h2>


                            <a th:href="@{/student/study}"
                               class="btn btn-sm btn-outline-warning">

                                Start Studying

                            </a>

                        </div>

                    </div>

                </div>


            </div>

        </div>


        <!-- ====================================================
             FOOTER
        ===================================================== -->

        <div th:replace="~{student-layout::footer}">
        </div>


    </div>

</div>


<!-- ============================================================
     SCRIPTS
============================================================ -->

<th:block th:replace="~{student-layout::scripts}">
</th:block>


</body>
</html>
