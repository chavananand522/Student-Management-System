<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Sign Up</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .signup-container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 4px;
        }

        .global-error {
            background: #f8d7da;
            color: #842029;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #0d6efd;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="signup-container">

    <h2>Student Sign Up</h2>

    <div class="global-error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/student/signup}"
          th:object="${studentSignupDTO}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="row">

            <div class="form-group">

                <label>First Name</label>

                <input type="text"
                       th:field="*{firstName}"
                       placeholder="First name">

                <div class="error"
                     th:if="${#fields.hasErrors('firstName')}"
                     th:errors="*{firstName}">
                </div>

            </div>

            <div class="form-group">

                <label>Last Name</label>

                <input type="text"
                       th:field="*{lastName}"
                       placeholder="Last name">

                <div class="error"
                     th:if="${#fields.hasErrors('lastName')}"
                     th:errors="*{lastName}">
                </div>

            </div>

        </div>

        <div class="form-group">

            <label>Email</label>

            <input type="email"
                   th:field="*{email}"
                   placeholder="Enter email">

            <div class="error"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>

        </div>

        <div class="form-group">

            <label>Phone Number</label>

            <input type="text"
                   th:field="*{phoneNumber}"
                   placeholder="Enter phone number">

        </div>

        <div class="form-group">

            <label>Address</label>

            <textarea th:field="*{address}"
                      placeholder="Enter address">
            </textarea>

        </div>

        <div class="form-group">

            <label>Password</label>

            <input type="password"
                   th:field="*{password}"
                   placeholder="Enter password">

            <div class="error"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}">
            </div>

        </div>

        <div class="form-group">

            <label>Confirm Password</label>

            <input type="password"
                   th:field="*{confirmPassword}"
                   placeholder="Confirm password">

            <div class="error"
                 th:if="${#fields.hasErrors('confirmPassword')}"
                 th:errors="*{confirmPassword}">
            </div>

        </div>

        <button type="submit">
            Create Student Account
        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a th:href="@{/login}">
            Login
        </a>

    </div>

</div>

</body>

</html>
