<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{student/student-layout::head}"></head>

<body>

<div class="d-flex student-layout">

    <div th:replace="~{student/student-layout::sidebar}"></div>

    <div class="student-content">

        <div th:replace="~{student/student-layout::navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <div class="d-flex align-items-center mb-4">
                <div class="trophy-icon">🏆</div>
                <h1 class="leadership-title">Leadership Board</h1>
            </div>

            <div class="podium-container">

                <div class="podium-card rank-two" th:if="${topStudents.size() >= 2}">
                    <div class="medal">🥈</div>
                    <div class="student-image"><div class="default-avatar">👤</div></div>
                    <h3 th:text="${topStudents[1].studentName}">Student 2</h3>
                    <div class="average-mark"
                         th:text="${#numbers.formatDecimal(topStudents[1].averageMarks, 1, 2) + '%'}">
                        85.00%
                    </div>
                </div>

                <div class="podium-card rank-one" th:if="${!topStudents.isEmpty()}">
                    <div class="medal">🥇</div>
                    <div class="student-image"><div class="default-avatar">👤</div></div>
                    <h3 th:text="${topStudents[0].studentName}">Student 1</h3>
                    <div class="average-mark"
                         th:text="${#numbers.formatDecimal(topStudents[0].averageMarks, 1, 2) + '%'}">
                        95.00%
                    </div>
                </div>

                <div class="podium-card rank-three" th:if="${topStudents.size() >= 3}">
                    <div class="medal">🥉</div>
                    <div class="student-image"><div class="default-avatar">👤</div></div>
                    <h3 th:text="${topStudents[2].studentName}">Student 3</h3>
                    <div class="average-mark"
                         th:text="${#numbers.formatDecimal(topStudents[2].averageMarks, 1, 2) + '%'}">
                        80.00%
                    </div>
                </div>

            </div>

            <div class="ranking-table-card">
                <h2>Student Rankings</h2>
                <div class="table-responsive">
                    <table class="table ranking-table">
                        <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Student</th>
                            <th>Total Marks</th>
                            <th>Average Marks</th>
                            <th>Tests Taken</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="student, stat : ${rankings}">
                            <td><span class="table-rank" th:text="${stat.index + 1}">1</span></td>
                            <td><strong th:text="${student.studentName}"></strong></td>
                            <td th:text="${student.totalMarks}">0</td>
                            <td><strong th:text="${#numbers.formatDecimal(student.averageMarks, 1, 2) + '%'}"></strong></td>
                            <td th:text="${student.testsTaken}">0</td>
                        </tr>
                        <tr th:if="${rankings == null || rankings.isEmpty()}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-trophy fs-1 d-block mb-3"></i>
                                No ranking data available yet.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

</div>

<th:block th:replace="~{student/student-layout::scripts}"></th:block>

</body>
</html>
