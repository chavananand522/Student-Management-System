<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{student/student-layout::head}"></head>

<body>

<div class="d-flex">

    <div th:replace="~{student/student-layout::sidebar}"></div>

    <div class="student-content">

        <div th:replace="~{student/student-layout::navbar}"></div>

        <div th:replace="~{student/student-layout::alerts}"></div>

        <div class="container-fluid px-4 py-4">

            <h2 class="fw-bold mb-4">
                My Results
            </h2>

            <div class="card student-card">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead>

                        <tr>

                            <th>Test</th>
                            <th>Attempt</th>
                            <th>Marks</th>
                            <th>Correct</th>
                            <th>Wrong</th>
                            <th>Unanswered</th>
                            <th>Status</th>
                            <th>Submitted</th>
                            <th>Action</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="attempt : ${attempts}">

                            <td th:text="${attempt.test.testName}">
                                Test
                            </td>

                            <td th:text="${attempt.attemptNumber}">
                                1
                            </td>

                            <td th:text="${attempt.obtainedMarks + ' / ' + attempt.test.totalMarks}">
                                0 / 0
                            </td>

                            <td th:text="${attempt.correctAnswers}">
                                0
                            </td>

                            <td th:text="${attempt.wrongAnswers}">
                                0
                            </td>

                            <td th:text="${attempt.unansweredQuestions}">
                                0
                            </td>

                            <td>

                                <span class="badge bg-success"
                                      th:if="${attempt.status == 'SUBMITTED'}">
                                    Submitted
                                </span>

                                <span class="badge bg-warning text-dark"
                                      th:unless="${attempt.status == 'SUBMITTED'}">
                                    In Progress
                                </span>

                            </td>

                            <td th:text="${attempt.submittedAt != null ? #temporals.format(attempt.submittedAt,'dd MMM yyyy HH:mm') : '-'}">
                            </td>

                            <td>

                                <a th:if="${attempt.status == 'SUBMITTED'}"
                                   th:href="@{'/student/results/' + attempt.id}"
                                   class="btn btn-sm btn-outline-primary">
                                    View
                                </a>

                                <a th:unless="${attempt.status == 'SUBMITTED'}"
                                   th:href="@{'/student/tests/attempt/' + attempt.id}"
                                   class="btn btn-sm btn-warning">
                                    Resume
                                </a>

                            </td>

                        </tr>

                        <tr th:if="${attempts.isEmpty()}">

                            <td colspan="9"
                                class="text-center py-5 text-muted">
                                No test results available.
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<th:block th:replace="~{student/student-layout::scripts}"></th:block>

</body>
</html>
