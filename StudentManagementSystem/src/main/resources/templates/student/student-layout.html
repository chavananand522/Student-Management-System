<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>SMS Student Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/student-style.css}" rel="stylesheet">

</head>


<aside th:fragment="sidebar" class="student-sidebar bg-dark text-white">

    <div class="student-brand border-bottom border-secondary">
        <i class="bi bi-mortarboard-fill me-2"></i>
        <span>SMS Student</span>
    </div>

    <nav class="mt-2">

        <a th:href="@{/student/dashboard}" class="student-link">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/student/courses}" class="student-link">
            <i class="bi bi-book"></i>
            <span>My Courses</span>
        </a>

        <a class="student-link"
           data-bs-toggle="collapse"
           href="#studySubmenu"
           role="button"
           aria-expanded="false"
           aria-controls="studySubmenu">
            <i class="bi bi-journal-bookmark"></i>
            <span>Study</span>
            <i class="bi bi-chevron-down ms-auto"></i>
        </a>

        <div class="collapse" id="studySubmenu">
            <a th:href="@{/student/study/physics}" class="student-link student-sub-link">
                <i class="bi bi-lightning-charge"></i>
                <span>Physics</span>
            </a>
            <a th:href="@{/student/study/chemistry}" class="student-link student-sub-link">
                <i class="bi bi-droplet"></i>
                <span>Chemistry</span>
            </a>
            <a th:href="@{/student/study/biology}" class="student-link student-sub-link">
                <i class="bi bi-heart-pulse"></i>
                <span>Biology</span>
            </a>
        </div>

        <a class="student-link"
           data-bs-toggle="collapse"
           href="#testSubmenu"
           role="button"
           aria-expanded="false"
           aria-controls="testSubmenu">
            <i class="bi bi-pencil-square"></i>
            <span>Tests</span>
            <i class="bi bi-chevron-down ms-auto"></i>
        </a>

        <div class="collapse" id="testSubmenu">
            <a th:href="@{/student/tests}" class="student-link student-sub-link">
                <i class="bi bi-file-earmark-text"></i>
                <span>Available Tests</span>
            </a>
            <a th:href="@{/student/results}" class="student-link student-sub-link">
                <i class="bi bi-bar-chart"></i>
                <span>My Results</span>
            </a>
            <a th:href="@{/student/analysis}" class="student-link student-sub-link">
                <i class="bi bi-activity"></i>
                <span>Analysis</span>
            </a>
        </div>

        <a th:href="@{/student/fees}" class="student-link">
            <i class="bi bi-wallet2"></i>
            <span>My Fees</span>
        </a>

        <a th:href="@{/student/profile}" class="student-link">
            <i class="bi bi-person-circle"></i>
            <span>My Profile</span>
        </a>

        <form method="post" th:action="@{/logout}" class="m-0">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <button type="submit"
                    class="student-link w-100 border-0 bg-transparent text-start">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </button>
        </form>

    </nav>

</aside>


<div th:fragment="navbar" class="student-navbar-wrapper">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom student-topbar">

        <div class="container-fluid">

            <span class="navbar-brand fw-bold">Student Portal</span>

            <div class="ms-auto d-flex align-items-center gap-2">
                <a th:href="@{/student/profile}" class="text-decoration-none text-dark">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${#authentication.name}">Student</span>
                </a>
            </div>

        </div>

    </nav>

</div>


<div th:fragment="alerts" class="container-fluid px-4 pt-3">

    <div th:if="${message}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

</div>


<footer th:fragment="footer" class="py-4 mt-5 border-top text-muted">
    <div class="container-fluid px-4 small">
        Student Management System © 2026
    </div>
</footer>


<th:block th:fragment="scripts">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const path = window.location.pathname;

            if (path.startsWith("/student/study")) {
                const submenu = document.getElementById("studySubmenu");
                if (submenu) {
                    submenu.classList.add("show");
                    const toggle = document.querySelector('[href="#studySubmenu"]');
                    if (toggle) toggle.setAttribute("aria-expanded", "true");
                }
            }

            if (path.startsWith("/student/tests")
                || path.startsWith("/student/results")
                || path.startsWith("/student/analysis")) {
                const submenu = document.getElementById("testSubmenu");
                if (submenu) {
                    submenu.classList.add("show");
                    const toggle = document.querySelector('[href="#testSubmenu"]');
                    if (toggle) toggle.setAttribute("aria-expanded", "true");
                }
            }

        });
    </script>

</th:block>


<style>

    .student-sub-link {
        padding-left: 50px !important;
        font-size: 14px;
        opacity: 0.85;
    }

    .student-sub-link i {
        font-size: 14px;
        min-width: 18px;
    }

    .student-sub-link:hover {
        opacity: 1;
    }

    .student-link .bi-chevron-down {
        transition: transform 0.25s ease;
        font-size: 12px;
        opacity: 0.6;
    }

    .student-link[aria-expanded="true"] .bi-chevron-down {
        transform: rotate(180deg);
    }

    .student-link:hover .bi-chevron-down {
        opacity: 1;
    }

</style>

</html>
