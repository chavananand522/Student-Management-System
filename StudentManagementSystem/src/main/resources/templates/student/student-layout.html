<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="_csrf"
          th:content="${_csrf.token}">

    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">

    <title>SMS Student Portal</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Application CSS -->
    <link
        th:href="@{/css/style.css}"
        rel="stylesheet">

    <style>

        .student-sidebar {
            min-height: 100vh;
            width: 250px;
            flex-shrink: 0;
        }

        .student-brand {
            padding: 20px;
            font-size: 20px;
            font-weight: 700;
        }

        .student-link {
            color: #adb5bd;
            text-decoration: none;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .student-link:hover,
        .student-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.10);
        }

        .student-link i {
            width: 22px;
        }

        .student-content {
            min-width: 0;
            flex: 1;
        }

        .student-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: #eef3ff;
        }

        .option-card {
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .option-card:hover {
            background: #f8f9fa;
        }

        .student-topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        @media (max-width: 768px) {

            .student-sidebar {
                width: 72px;
            }

            .student-brand span,
            .student-link span {
                display: none;
            }

            .student-link {
                justify-content: center;
                padding: 14px 0;
            }

            .student-link i {
                margin: 0;
            }
        }

    </style>

</head>


<!-- ============================================================
     SIDEBAR
============================================================ -->

<aside th:fragment="sidebar"
       class="student-sidebar bg-dark text-white">

    <div class="student-brand border-bottom border-secondary">

        <i class="bi bi-mortarboard-fill me-2"></i>

        <span>SMS Student</span>

    </div>


    <nav class="mt-2">

        <!-- Dashboard -->
        <a th:href="@{/student/dashboard}"
           class="student-link">

            <i class="bi bi-speedometer2"></i>

            <span>Dashboard</span>

        </a>


        <!-- Courses -->
        <a th:href="@{/student/courses}"
           class="student-link">

            <i class="bi bi-book"></i>

            <span>My Courses</span>

        </a>


        <!-- Study -->
        <a th:href="@{/student/study}"
           class="student-link">

            <i class="bi bi-journal-bookmark"></i>

            <span>Study</span>

        </a>


        <!-- Tests -->
        <a th:href="@{/student/tests}"
           class="student-link">

            <i class="bi bi-pencil-square"></i>

            <span>Tests</span>

        </a>


        <!-- Results -->
        <a th:href="@{/student/results}"
           class="student-link">

            <i class="bi bi-bar-chart"></i>

            <span>My Results</span>

        </a>


        <!-- Fees -->
        <a th:href="@{/student/fees}"
           class="student-link">

            <i class="bi bi-wallet2"></i>

            <span>My Fees</span>

        </a>


        <!-- Profile -->
        <a th:href="@{/student/profile}"
           class="student-link">

            <i class="bi bi-person-circle"></i>

            <span>My Profile</span>

        </a>


        <!-- Logout -->
        <form method="post"
              th:action="@{/logout}"
              class="m-0">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button
                type="submit"
                class="student-link w-100 border-0 bg-transparent text-start">

                <i class="bi bi-box-arrow-right"></i>

                <span>Logout</span>

            </button>

        </form>

    </nav>

</aside>


<!-- ============================================================
     NAVBAR
============================================================ -->

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-light bg-white border-bottom student-topbar">

    <div class="container-fluid">

        <span class="navbar-brand fw-bold">
            Student Portal
        </span>


        <div class="ms-auto d-flex align-items-center gap-2">

            <a th:href="@{/student/profile}"
               class="text-decoration-none text-dark">

                <i class="bi bi-person-circle me-1"></i>

                <span th:text="${#authentication.name}">
                    Student
                </span>

            </a>

        </div>

    </div>

</nav>


<!-- ============================================================
     ALERTS
============================================================ -->

<div th:fragment="alerts"
     class="container-fluid px-4 pt-3">

    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

</div>


<!-- ============================================================
     FOOTER
============================================================ -->

<footer th:fragment="footer"
        class="py-4 mt-5 border-top text-muted">

    <div class="container-fluid px-4 small">

        Student Management System © 2026

    </div>

</footer>


<!-- ============================================================
     SCRIPTS
============================================================ -->

<th:block th:fragment="scripts">

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

</th:block>

</html>
