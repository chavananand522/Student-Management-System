<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{student/student-layout::head}"></head>

<body>

<div class="d-flex student-layout">

    <div th:replace="~{student/student-layout::sidebar}"></div>

    <div class="student-content">

        <div th:replace="~{student/student-layout::navbar}"></div>
        <div th:replace="~{student/student-layout::alerts}"></div>

        <div class="container-fluid px-4 py-4">

            <div class="settings-header mb-4">
                <h1 class="settings-title">
                    <i class="bi bi-gear"></i> Settings
                </h1>
                <p class="settings-subtitle">Manage your account preferences and data.</p>
            </div>

            <div class="settings-section mb-4">
                <h2 class="settings-section-title">Account Settings</h2>

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="settings-card">
                            <div class="settings-card-icon">
                                <i class="bi bi-person-circle"></i>
                            </div>
                            <div class="settings-card-content">
                                <h3>Profile Information</h3>
                                <p>Update your personal details and contact information.</p>
                                <a th:href="@{/student/profile}" class="btn btn-primary">
                                    <i class="bi bi-pencil"></i> Edit Profile
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="settings-card">
                            <div class="settings-card-icon">
                                <i class="bi bi-shield-lock"></i>
                            </div>
                            <div class="settings-card-content">
                                <h3>Change Password</h3>
                                <p>Update your password to keep your account secure.</p>
                                <a th:href="@{/student/profile}" class="btn btn-primary">
                                    <i class="bi bi-key"></i> Change Password
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>

<th:block th:replace="~{student/student-layout::scripts}"></th:block>

</body>
</html>
