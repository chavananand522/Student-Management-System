<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>

<div class="d-flex" id="wrapper">

    <!-- SIDEBAR -->

    <div th:replace="~{fragments/layout :: sidebar}"></div>


    <!-- PAGE CONTENT -->

    <div id="page-content-wrapper">

        <!-- NAVBAR -->

        <div th:replace="~{fragments/layout :: navbar}"></div>


        <!-- CONTENT -->

        <div class="container-fluid px-4 py-4">

            <!-- ============================== -->
            <!-- WELCOME -->
            <!-- ============================== -->

            <div class="mb-4">

                <h2 class="fw-bold">

                    Welcome,
                    <span th:text="${student.firstName}">
                        Student
                    </span>

                </h2>

                <p class="text-muted mb-0">
                    Welcome to your Student Dashboard.
                </p>

            </div>


            <!-- ============================== -->
            <!-- STAT CARDS -->
            <!-- ============================== -->

            <div class="row g-4 mb-4">


                <!-- COURSES -->

                <div class="col-md-4">

                    <div class="card shadow-sm border-0 h-100">

                        <div class="card-body">

                            <div class="d-flex
                                        justify-content-between
                                        align-items-center">

                                <div>

                                    <h6 class="text-muted">
                                        My Courses
                                    </h6>

                                    <h2
                                        class="fw-bold"
                                        th:text="${courseCount}">
                                        0
                                    </h2>

                                </div>

                                <i class="bi bi-book
                                          fs-1
                                          text-primary">
                                </i>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- STUDY -->

                <div class="col-md-4">

                    <div class="card shadow-sm border-0 h-100">

                        <div class="card-body">

                            <div class="d-flex
                                        justify-content-between
                                        align-items-center">

                                <div>

                                    <h6 class="text-muted">
                                        Study Material
                                    </h6>

                                    <h2 class="fw-bold">
                                        Study
                                    </h2>

                                </div>

                                <i class="bi bi-journal-bookmark
                                          fs-1
                                          text-success">
                                </i>

                            </div>

                            <a href="/study"
                               class="btn btn-success btn-sm mt-2">

                                Start Studying

                            </a>

                        </div>

                    </div>

                </div>


                <!-- TESTS -->

                <div class="col-md-4">

                    <div class="card shadow-sm border-0 h-100">

                        <div class="card-body">

                            <div class="d-flex
                                        justify-content-between
                                        align-items-center">

                                <div>

                                    <h6 class="text-muted">
                                        Tests
                                    </h6>

                                    <h2 class="fw-bold">
                                        Tests
                                    </h2>

                                </div>

                                <i class="bi bi-pencil-square
                                          fs-1
                                          text-warning">
                                </i>

                            </div>

                            <a href="/tests"
                               class="btn btn-warning btn-sm mt-2">

                                View Tests

                            </a>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ============================== -->
            <!-- STUDENT INFORMATION -->
            <!-- ============================== -->

            <div class="card shadow-sm border-0">

                <div class="card-header bg-white">

                    <h5 class="mb-0">

                        <i class="bi bi-person-circle me-2"></i>

                        My Profile

                    </h5>

                </div>


                <div class="card-body">

                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <strong>
                                Full Name
                            </strong>

                            <p class="text-muted mb-0"
                               th:text="${student.firstName + ' ' + student.lastName}">
                            </p>

                        </div>


                        <div class="col-md-6 mb-3">

                            <strong>
                                Email
                            </strong>

                            <p class="text-muted mb-0"
                               th:text="${student.email}">
                            </p>

                        </div>


                        <div class="col-md-6 mb-3">

                            <strong>
                                Phone
                            </strong>

                            <p class="text-muted mb-0"
                               th:text="${student.phoneNumber}">
                            </p>

                        </div>


                        <div class="col-md-6 mb-3">

                            <strong>
                                Address
                            </strong>

                            <p class="text-muted mb-0"
                               th:text="${student.address}">
                            </p>

                        </div>


                    </div>

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <div th:replace="~{fragments/layout :: footer}"></div>

    </div>

</div>


<div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
