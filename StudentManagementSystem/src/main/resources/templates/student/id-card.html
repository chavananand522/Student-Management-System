<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{student/student-layout::head}"></head>

<body>

<div class="d-flex student-layout">

    <div th:replace="~{student/student-layout::sidebar}"></div>

    <div class="student-content">

        <div th:replace="~{student/student-layout::navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <h1 class="id-card-page-title mb-4">
                <i class="bi bi-person-vcard-fill"></i> Student ID Card
            </h1>

            <div class="id-card-wrapper">
                <div class="student-id-card">

                    <div class="id-card-header">
                        <div class="id-card-logo">
                            <i class="bi bi-mortarboard-fill"></i>
                        </div>
                        <div class="id-card-header-text">
                            <div class="id-card-system-name">STUDENT MANAGEMENT SYSTEM</div>
                            <div class="id-card-type">STUDENT IDENTITY CARD</div>
                        </div>
                    </div>

                    <div class="id-card-body">
                        <div class="id-card-photo">
                            <img th:src="@{/profile/image}"
                                 alt="Profile"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="photo-placeholder" style="display:none;">
                                <i class="bi bi-person-fill"></i>
                            </div>
                        </div>

                        <div class="id-card-details">
                            <h2 class="id-student-name"
                                th:text="${student.firstName + ' ' + student.lastName}"></h2>

                            <div class="id-detail-row">
                                <span>Student ID</span>
                                <strong th:text="${'STU' + student.id}">STU001</strong>
                            </div>

                            <div class="id-detail-row">
                                <span>Email</span>
                                <strong th:text="${student.email}"></strong>
                            </div>

                            <div class="id-detail-row">
                                <span>Phone</span>
                                <strong th:text="${student.phoneNumber}"></strong>
                            </div>

                            <div class="id-detail-row">
                                <span>Status</span>
                                <strong class="active-status"
                                        th:text="${student.active ? 'Active' : 'Inactive'}"></strong>
                            </div>
                        </div>
                    </div>

                    <div class="id-card-bottom">
                        <div class="id-card-validity">
                            <span>VALIDITY</span>
                            <strong>2026 - 2027</strong>
                        </div>
                        <div class="id-card-qr">
                            <i class="bi bi-qr-code"></i>
                        </div>
                    </div>

                    <div class="id-card-footer">
                        <span>
                            <i class="bi bi-shield-check"></i>
                            Official Student Card
                        </span>
                        <span>SMS STUDENT</span>
                    </div>

                </div>
            </div>

        </div>

        <div th:replace="~{student/student-layout::footer}"></div>

    </div>

</div>

<th:block th:replace="~{student/student-layout::scripts}"></th:block>

</body>
</html>
