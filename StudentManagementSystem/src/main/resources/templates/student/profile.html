<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{student/student-layout::head}"></head>

<body>

<div class="d-flex">

    <div th:replace="~{student/student-layout::sidebar}"></div>

    <div class="student-content">

        <div th:replace="~{student/student-layout::navbar}"></div>

        <div th:replace="~{student/student-layout::alerts}"></div>

        <div class="container-fluid px-4 py-4">

            <h2 class="fw-bold mb-4">
                My Profile
            </h2>

            <div class="row g-4">

                <div class="col-lg-6">

                    <div class="card student-card">

                        <div class="card-body p-4">

                            <h5 class="mb-4">
                                Student Information
                            </h5>

                            <div class="mb-3">
                                <label class="text-muted">Name</label>
                                <div class="fw-semibold"
                                     th:text="${student.firstName + ' ' + student.lastName}">
                                    Student
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="text-muted">Email</label>
                                <div class="fw-semibold"
                                     th:text="${student.email}">
                                    email
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="text-muted">Phone</label>
                                <div class="fw-semibold"
                                     th:text="${student.phoneNumber}">
                                    phone
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="text-muted">Address</label>
                                <div class="fw-semibold"
                                     th:text="${student.address}">
                                    address
                                </div>
                            </div>

                        </div>

                    </div>

                </div>

                <div class="col-lg-6">

                    <div class="card student-card">

                        <div class="card-body p-4">

                            <h5 class="mb-4">
                                Change Password
                            </h5>

                            <form th:action="@{/student/profile/password}"
                                  method="post">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <div class="mb-3">
                                    <label class="form-label">Current Password</label>
                                    <input type="password"
                                           name="currentPassword"
                                           class="form-control"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">New Password</label>
                                    <input type="password"
                                           name="newPassword"
                                           class="form-control"
                                           minlength="6"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password"
                                           name="confirmPassword"
                                           class="form-control"
                                           minlength="6"
                                           required>
                                </div>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Change Password
                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<th:block th:replace="~{student/student-layout::scripts}"></th:block>

</body>
</html>
