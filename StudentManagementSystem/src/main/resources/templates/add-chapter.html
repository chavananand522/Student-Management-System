<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}">
</head>

<body>

<div class="d-flex" id="wrapper">

    <div th:replace="~{fragments/layout::sidebar}">
    </div>

    <div id="page-content-wrapper">

        <div th:replace="~{fragments/layout::navbar}">
        </div>

        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h2>Add New Chapter</h2>

                    <p class="text-muted mb-0">
                        <span th:text="${module.subject}">Physics</span>
                        ›
                        <span th:text="${module.name}">Mechanics</span>
                    </p>
                </div>

                <!-- BACK TO THE MODULE -->
                <a th:href="@{/study/{subject}/module/{id}(subject=${module.subject.toLowerCase()},id=${module.id})}"
                   class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back
                </a>

            </div>


            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white">
                    <i class="bi bi-journal-plus me-1"></i>
                    Chapter Details
                </div>

                <div class="card-body">

                    <form th:action="@{/chapter/list}"
                          th:object="${chapter}"
                          method="post">

                        <!-- HIDDEN: subject + moduleId so the chapter belongs to this module -->
                        <input type="hidden" th:field="*{subject}">
                        <input type="hidden" th:field="*{moduleId}">

                        <div class="mb-3">
                            <label class="form-label">Chapter Name</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   placeholder="Enter chapter name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control"
                                      th:field="*{description}"
                                      rows="4"
                                      placeholder="Enter chapter description"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            Save Chapter
                        </button>

                        <a th:href="@{/study/{subject}/module/{id}(subject=${module.subject.toLowerCase()},id=${module.id})}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/layout::scripts}">
</div>

</body>

</html>
