<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout::head}">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/layout::sidebar}">
    </div>

    <div id="page-content-wrapper">
        <div th:replace="~{fragments/layout::navbar}">
        </div>

        <div class="container-fluid px-4 py-4">

            <div th:if="${message}"
                 class="alert alert-success text-center"
                 role="alert"
                 th:text="${message}">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <div class="mb-2">
                        <a th:href="@{/study}"
                           class="text-primary text-decoration-none">
                            Study
                        </a>
                        <span class="mx-2">›</span>
                        <a th:href="@{/study/{subject}(subject=${chapter.subject.toLowerCase()})}"
                           class="text-primary text-decoration-none"
                           th:text="${chapter.subject}">
                            Biology
                        </a>
                        <span class="mx-2">›</span>
                        <a th:href="@{/chapter/{id}(id=${chapter.id})}"
                           class="text-primary text-decoration-none"
                           th:text="${chapter.name}">
                            Cell Biology
                        </a>
                        <span class="mx-2">›</span>
                        <span th:text="${topic.name}">
                            Cell Membrane
                        </span>
                    </div>

                    <h2 class="fw-bold mb-0"
                        th:text="${topic.name}">
                        Cell Membrane
                    </h2>
                </div>

                <a th:href="@{/chapter/{id}(id=${chapter.id})}"
                   class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back
                </a>

            </div>

            <div class="card shadow-sm">

                <div class="card-header d-flex justify-content-between align-items-center">

                    <span>
                        <i class="bi bi-journal-text me-1"></i>
                        Topic Details
                    </span>

                    <div>

                        <a th:href="@{/topic/{id}/edit(id=${topic.id})}"
                           class="btn btn-sm btn-outline-warning">
                            <i class="bi bi-pencil me-1"></i>
                            Edit
                        </a>

                        <form th:action="@{/topic/{id}/delete(id=${topic.id})}"
                              method="post"
                              style="display:inline;">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Are you sure you want to delete this topic?');">
                                <i class="bi bi-trash me-1"></i>
                                Delete
                            </button>

                        </form>

                    </div>

                </div>

                <div class="card-body">

                    <p th:if="${topic.description != null && !topic.description.isEmpty()}"
                       th:text="${topic.description}"
                       style="white-space: pre-wrap;">
                        Topic description goes here.
                    </p>

                    <p th:if="${topic.description == null || topic.description.isEmpty()}"
                       class="text-muted mb-0">
                        No description added yet.
                    </p>

                </div>

            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout::scripts}">
</div>

</body>
</html>
