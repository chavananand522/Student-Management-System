<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout::head}">
</head>
<body>
<div class="d-flex" id="wrapper">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/layout::sidebar}">
    </div>

    <!-- PAGE CONTENT -->
    <div id="page-content-wrapper">

        <!-- NAVBAR -->
        <div th:replace="~{fragments/layout::navbar}">
        </div>

        <div class="container-fluid px-4 py-4">

            <div th:if="${message}"
                 class="alert alert-success text-center"
                 role="alert"
                 th:text="${message}">
            </div>

            <!-- MODULE HEADER -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <!-- BREADCRUMB: Study > Subject > Module -->
                            <div class="mb-2">
                                <a th:href="@{/study}"
                                   class="text-primary text-decoration-none">
                                    Study
                                </a>
                                <span class="mx-2">›</span>
                                <a th:href="@{/study/{subject}(subject=${subjectName.toLowerCase()})}"
                                   class="text-primary text-decoration-none"
                                   th:text="${subjectName}">
                                    Physics
                                </a>
                                <span class="mx-2">›</span>
                                <span th:text="${module.name}">Mechanics</span>
                            </div>

                            <h1 class="fw-bold mb-1"
                                th:text="${module.name}">
                                Module name
                            </h1>

                            <p class="text-muted mb-0">
                                Module
                                <span th:text="${module.moduleNumber}">1</span>
                                ·
                                <span th:text="${subjectName}">Physics</span>
                            </p>

                        </div>

                        <div class="text-primary" style="font-size: 48px;">
                            <i th:if="${subjectName == 'Physics'}"
                               class="bi bi-lightning-charge"></i>
                            <i th:if="${subjectName == 'Chemistry'}"
                               class="bi bi-droplet"></i>
                            <i th:if="${subjectName == 'Biology'}"
                               class="bi bi-heart-pulse"></i>
                        </div>

                    </div>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="d-flex justify-content-end mb-3">

                <a th:href="@{/study/{subject}/module/{id}(subject=${subjectName.toLowerCase()},id=${module.id})}"
                   class="btn btn-primary me-2">
                    <i class="bi bi-journal-text me-1"></i>
                    View Chapters
                </a>

                <a th:href="@{/module/{id}/edit(id=${module.id})}"
                   class="btn btn-outline-warning me-2">
                    <i class="bi bi-pencil me-1"></i>
                    Edit Module
                </a>

                <form th:action="@{/module/{id}/delete(id=${module.id})}"
                      method="post"
                      class="me-2">
                    <button type="submit"
                            class="btn btn-outline-danger"
                            onclick="return confirm('Delete this module and all chapters inside it?');">
                        <i class="bi bi-trash me-1"></i>
                        Delete
                    </button>
                </form>

                <a th:href="@{/study/{subject}(subject=${subjectName.toLowerCase()})}"
                   class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back
                </a>

            </div>

            <!-- MODULE DETAILS -->
            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white">
                    <i class="bi bi-journal-text me-1"></i>
                    About this module
                </div>

                <div class="card-body">

                    <p th:if="${module.description != null && !module.description.isEmpty()}"
                       th:text="${module.description}"
                       style="white-space: pre-wrap;">
                        Module description
                    </p>

                    <p class="text-muted"
                       th:if="${module.description == null || module.description.isEmpty()}">
                        No description added for this module yet.
                    </p>

                    <hr>

                    <div class="d-flex flex-wrap gap-4">

                        <div>
                            <div class="text-muted small">Subject</div>
                            <div class="fw-semibold" th:text="${subjectName}">Physics</div>
                        </div>

                        <div>
                            <div class="text-muted small">Module number</div>
                            <div class="fw-semibold" th:text="${module.moduleNumber}">1</div>
                        </div>

                        <div>
                            <div class="text-muted small">Chapters</div>
                            <div class="fw-semibold" th:text="${chapterCount}">0</div>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>
</div>

<!-- SCRIPTS -->
<div th:replace="~{fragments/layout::scripts}">
</div>

</body>
</html>
