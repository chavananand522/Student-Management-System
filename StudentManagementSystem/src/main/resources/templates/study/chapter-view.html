<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout::head}">
</head>
<body>
<div class="d-flex" id="wrapper">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/layout::sidebar}">
    </div>

    <!-- PAGE CONTENT -->
    <div id="page-content-wrapper">

        <!-- NAVBAR -->
        <div th:replace="~{fragments/layout::navbar}">
        </div>

        <div class="container-fluid px-4 py-4">

            <div th:if="${message}"
                 class="alert alert-success text-center"
                 role="alert"
                 th:text="${message}">
            </div>

            <!-- CHAPTER HEADER -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>

                            <!-- BREADCRUMB: Study > Subject > Module > Chapter -->
                            <div class="mb-2">
                                <a th:href="@{/study}"
                                   class="text-primary text-decoration-none">
                                    Study
                                </a>
                                <span class="mx-2">›</span>
                                <a th:href="@{/study/{subject}(subject=${chapter.subject.toLowerCase()})}"
                                   class="text-primary text-decoration-none"
                                   th:text="${chapter.subject}">
                                    Physics
                                </a>
                                <span class="mx-2">›</span>
                                <a th:href="@{/study/{subject}/module/{id}(subject=${chapter.subject.toLowerCase()},id=${module.id})}"
                                   class="text-primary text-decoration-none"
                                   th:text="${module.name}">
                                    Mechanics
                                </a>
                                <span class="mx-2">›</span>
                                <span th:text="${chapter.name}">Chapter</span>
                            </div>

                            <h1 class="fw-bold mb-1"
                                th:text="${chapter.name}">
                                Chapter name
                            </h1>

                            <p class="text-muted mb-0">
                                Module:
                                <span th:text="${module.name}">Module</span>
                            </p>
                        </div>

                        <div class="subject-icon">
                            <i th:if="${chapter.subject == 'Physics'}"
                               class="bi bi-lightning-charge"></i>
                            <i th:if="${chapter.subject == 'Chemistry'}"
                               class="bi bi-droplet"></i>
                            <i th:if="${chapter.subject == 'Biology'}"
                               class="bi bi-heart-pulse"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="d-flex justify-content-end mb-3">

                <a th:href="@{/chapter/{id}/edit(id=${chapter.id})}"
                   class="btn btn-outline-warning me-2">
                    <i class="bi bi-pencil me-1"></i>
                    Edit Chapter
                </a>

                <form th:action="@{/chapter/{id}/delete(id=${chapter.id})}"
                      method="post"
                      class="me-2">
                    <button type="submit"
                            class="btn btn-outline-danger"
                            onclick="return confirm('Are you sure you want to delete this chapter?');">
                        <i class="bi bi-trash me-1"></i>
                        Delete
                    </button>
                </form>

                <!-- BACK TO THE MODULE -->
                <a th:href="@{/study/{subject}/module/{id}(subject=${chapter.subject.toLowerCase()},id=${module.id})}"
                   class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back
                </a>

            </div>

            <!-- CHAPTER DETAILS -->
            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white">
                    <i class="bi bi-journal-text me-1"></i>
                    About this chapter
                </div>

                <div class="card-body">

                    <p class="mb-0"
                       th:if="${chapter.description != null && !chapter.description.isEmpty()}"
                       th:text="${chapter.description}">
                        Chapter description
                    </p>

                    <p class="text-muted mb-0"
                       th:if="${chapter.description == null || chapter.description.isEmpty()}">
                        No description added for this chapter yet.
                    </p>

                </div>

            </div>

        </div>
    </div>
</div>

<!-- SCRIPTS -->
<div th:replace="~{fragments/layout::scripts}">
</div>

</body>
</html>
