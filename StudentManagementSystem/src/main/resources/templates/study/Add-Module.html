<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}">
</head>

<body>

<div class="d-flex" id="wrapper">

    <div th:replace="~{fragments/layout::sidebar}">
    </div>

    <div id="page-content-wrapper">

        <div th:replace="~{fragments/layout::navbar}">
        </div>

        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h2>Add New Module</h2>

                    <p class="text-muted mb-0"
                       th:text="${module.subject}">
                        Physics
                    </p>
                </div>

                <a th:href="@{/study/{subject}(subject=${module.subject.toLowerCase()})}"
                   class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back
                </a>

            </div>

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white">
                    <i class="bi bi-journal-plus me-1"></i>
                    Module Details
                </div>

                <div class="card-body">

                    <form th:action="@{/module/save}"
                          th:object="${module}"
                          method="post">

                        <input type="hidden" th:field="*{subject}">

                        <div class="mb-3">
                            <label class="form-label">Module Number</label>
                            <input type="number"
                                   class="form-control"
                                   th:field="*{moduleNumber}"
                                   min="1"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Module Name</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   placeholder="Enter module name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control"
                                      th:field="*{description}"
                                      rows="4"
                                      placeholder="Enter module description"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            Save Module
                        </button>

                        <a th:href="@{/study/{subject}(subject=${module.subject.toLowerCase()})}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/layout::scripts}">
</div>

</body>

</html>
