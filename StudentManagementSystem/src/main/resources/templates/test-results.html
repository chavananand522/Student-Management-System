<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}">
</head>

<body>

<div class="d-flex" id="wrapper">

    <!-- SIDEBAR -->

    <div th:replace="~{fragments/layout::sidebar}">
    </div>

    <!-- MAIN CONTENT -->

    <div class="flex-grow-1">

        <!-- NAVBAR -->

        <div th:replace="~{fragments/layout::navbar}">
        </div>

        <main class="container-fluid p-4">

            <!-- ================================================= -->
            <!-- HEADER -->
            <!-- ================================================= -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h3 class="fw-bold mb-1">

                        <i class="bi bi-file-earmark-text me-2"></i>

                        Test Details

                    </h3>

                    <p class="text-muted mb-0">

                        View test information and questions

                    </p>

                </div>

                <a th:href="@{/tests/list}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left me-1"></i>

                    Back to Tests

                </a>

            </div>

            <!-- ================================================= -->
            <!-- TEST INFORMATION -->
            <!-- ================================================= -->

            <div class="card border-0 shadow-sm mb-4">

                <div class="card-body">

                    <h4 class="fw-bold mb-4"
                        th:text="${test.testName}">

                        Test Name

                    </h4>

                    <div class="row g-3">

                        <!-- COURSE -->

                        <div class="col-md-3">

                            <div class="text-muted">
                                Course
                            </div>

                            <strong th:text="${test.course}">

                                NEET

                            </strong>

                        </div>

                        <!-- SUBJECT -->

                        <div class="col-md-3">

                            <div class="text-muted">
                                Subject
                            </div>

                            <strong th:text="${test.subject}">

                                Physics

                            </strong>

                        </div>

                        <!-- CHAPTER -->

                        <div class="col-md-3">

                            <div class="text-muted">
                                Chapter
                            </div>

                            <strong th:text="${test.chapter}">

                                Chapter 1

                            </strong>

                        </div>

                        <!-- DURATION -->

                        <div class="col-md-3">

                            <div class="text-muted">
                                Duration
                            </div>

                            <strong>

                                <span th:text="${test.duration}">

                                    60

                                </span>

                                Minutes

                            </strong>

                        </div>

                        <!-- TOTAL QUESTIONS -->

                        <div class="col-md-3">

                            <div class="text-muted">
                                Total Questions
                            </div>

                            <strong th:text="${test.questions != null ? test.questions.size() : 0}">

                                0

                            </strong>

                        </div>

                        <!-- TOTAL MARKS -->

                        <div class="col-md-3">

                            <div class="text-muted">
                                Total Marks
                            </div>

                            <strong th:text="${test.totalMarks}">

                                100

                            </strong>

                        </div>

                        <!-- PASSING MARKS -->

                        <div class="col-md-3">

                            <div class="text-muted">
                                Passing Marks
                            </div>

                            <strong th:text="${test.passingMarks}">

                                40

                            </strong>

                        </div>

                        <!-- STATUS -->

                        <div class="col-md-3">

                            <div class="text-muted">
                                Status
                            </div>

                            <span th:if="${test.status == 'PUBLISHED'}"
                                  class="badge bg-success">

                                Published

                            </span>

                            <span th:unless="${test.status == 'PUBLISHED'}"
                                  class="badge bg-secondary">

                                Draft

                            </span>

                        </div>

                    </div>

                </div>

            </div>

            <!-- ================================================= -->
            <!-- QUESTIONS -->
            <!-- ================================================= -->

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white">

                    <h5 class="fw-bold mb-0">

                        <i class="bi bi-question-circle me-2"></i>

                        Questions

                    </h5>

                </div>

                <div class="card-body">

                    <!-- NO QUESTIONS -->

                    <div th:if="${test.questions == null || #lists.isEmpty(test.questions)}"
                         class="text-center text-muted py-4">

                        <i class="bi bi-question-circle fs-1 d-block mb-3"></i>

                        No questions found for this test.

                    </div>

                    <!-- QUESTIONS -->

                    <div th:if="${test.questions != null && !#lists.isEmpty(test.questions)}">

                        <div th:each="question, stat : ${test.questions}"
                             class="border rounded p-3 mb-3">

                            <div class="d-flex">

                                <strong class="me-2"
                                        th:text="${stat.count + '.'}">

                                    1.

                                </strong>

                                <span th:text="${question.questionText}">

                                    Question text

                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>

</body>

</html>
