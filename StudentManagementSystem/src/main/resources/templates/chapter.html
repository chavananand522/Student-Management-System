<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout::head}">
</head>
<body>
<div class="d-flex" id="wrapper">
    <!-- SIDEBAR -->
    <div th:replace="~{fragments/layout::sidebar}">
    </div>

    <!-- PAGE CONTENT -->
    <div id="page-content-wrapper">
        <!-- NAVBAR -->
        <div th:replace="~{fragments/layout::navbar}">
        </div>

        <div class="container-fluid px-4 py-4">

            <!-- SUCCESS MESSAGE -->
            <div th:if="${message}"
                 class="alert alert-success text-center"
                 role="alert"
                 th:text="${message}">
            </div>

            <!-- ================================================= -->
            <!-- CHAPTER HEADER -->
            <!-- ================================================= -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="mb-2">
                                <a th:href="@{/study}"
                                   class="text-primary text-decoration-none">
                                    Study
                                </a>
                                <span class="mx-2">›</span>
                                <a th:href="@{/study/{subject}(subject=${chapter.subject.toLowerCase()})}"
                                   class="text-primary text-decoration-none"
                                   th:text="${chapter.subject}">
                                    Biology
                                </a>
                                <span class="mx-2">›</span>
                                <span th:text="${chapter.name}">
                                    Cell Biology
                                </span>
                            </div>

                            <h1 class="fw-bold mb-1"
                                th:text="${chapter.name}">
                                Cell Biology
                            </h1>

                            <p class="text-muted mb-0"
                               th:if="${chapter.description != null && !chapter.description.isEmpty()}"
                               th:text="${chapter.description}">
                                Cell structure, functions and cellular processes
                            </p>
                        </div>

                        <div class="subject-icon">
                            <i th:if="${chapter.subject == 'Physics'}"
                               class="bi bi-lightning-charge">
                            </i>
                            <i th:if="${chapter.subject == 'Chemistry'}"
                               class="bi bi-droplet">
                            </i>
                            <i th:if="${chapter.subject == 'Biology'}"
                               class="bi bi-heart-pulse">
                            </i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================================================= -->
            <!-- TOPICS HEADER -->
            <!-- ================================================= -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h3 class="fw-bold mb-1"
                        th:text="${chapter.name + ' Topics'}">
                        Cell Biology Topics
                    </h3>
                    <p class="text-muted mb-0">
                        Manage topics
                    </p>
                </div>

                <div>
                    <!-- EDIT CHAPTER -->
                    <a th:href="@{/chapter/{id}/edit(id=${chapter.id})}"
                       class="btn btn-outline-warning me-2">
                        <i class="bi bi-pencil me-1"></i>
                        Edit Chapter
                    </a>

                    <!-- ADD TOPIC -->
                    <a th:href="@{/topic/new(chapterId=${chapter.id})}"
                       class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>
                        Add New Topic
                    </a>
                </div>
            </div>

            <!-- ================================================= -->
            <!-- NO TOPICS -->
            <!-- ================================================= -->
            <div th:if="${topics == null || topics.isEmpty()}"
                 class="card border-0 shadow-sm">
                <div class="card-body text-center py-5">
                    <i class="bi bi-journal-x fs-1 text-muted"></i>
                    <h5 class="mt-3">
                        No Topics Found
                    </h5>
                    <p class="text-muted">
                        Add a new topic to this chapter.
                    </p>
                </div>
            </div>

            <!-- ================================================= -->
            <!-- TOPICS LIST -->
            <!-- ================================================= -->
            <div th:if="${topics != null && !topics.isEmpty()}"
                 class="chapter-container">

                <!-- ONE TOPIC -->
                <div th:each="topic : ${topics}"
                     class="chapter-row">

                    <div class="chapter-info">

                        <a th:href="@{/topic/{id}(id=${topic.id})}"
                           class="chapter-name"
                           th:text="${topic.name}">
                            Cell Membrane
                        </a>

                        <div class="chapter-description"
                             th:if="${topic.description != null && !topic.description.isEmpty()}"
                             th:text="${topic.description}">
                            Topic description
                        </div>

                    </div>

                    <div class="chapter-actions">

                        <a th:href="@{/topic/{id}(id=${topic.id})}"
                           class="btn btn-sm btn-outline-primary"
                           title="View">
                            👁
                        </a>

                        <a th:href="@{/topic/{id}/edit(id=${topic.id})}"
                           class="btn btn-sm btn-outline-warning"
                           title="Edit">
                            ✏️
                        </a>

                        <form th:action="@{/topic/{id}/delete(id=${topic.id})}"
                              method="post"
                              style="display:inline;">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger"
                                    title="Delete"
                                    onclick="return confirm('Are you sure you want to delete this topic?');">
                                🗑
                            </button>

                        </form>

                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- SCRIPTS -->
<div th:replace="~{fragments/layout::scripts}">
</div>

<style>
    .chapter-container {
        width: 100%;
    }
    .chapter-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #ffffff;
        border: 1px solid #e9ecef;
        border-radius: 12px;
        padding: 14px 20px;
        margin-bottom: 12px;
        transition: all 0.2s ease;
    }
    .chapter-row:hover {
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        transform: translateY(-1px);
    }
    .chapter-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .chapter-name {
        font-weight: 600;
        font-size: 16px;
        color: #212529;
        text-decoration: none;
    }
    .chapter-name:hover {
        color: #4361ee;
    }
    .chapter-description {
        color: #6c757d;
        font-size: 14px;
    }
    .chapter-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: 20px;
    }
    .chapter-actions .btn {
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    @media (max-width: 768px) {
        .chapter-row {
            flex-direction: column;
            align-items: flex-start;
        }
        .chapter-actions {
            margin-left: 0;
            margin-top: 10px;
        }
    }
</style>
</body>
</html>
