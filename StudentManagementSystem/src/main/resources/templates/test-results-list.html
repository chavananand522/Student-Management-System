<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout::head}">
</head>

<body>

<div class="d-flex" id="wrapper">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/layout::sidebar}"></div>

    <!-- PAGE CONTENT -->
    <div id="page-content-wrapper">

        <!-- NAVBAR -->
        <div th:replace="~{fragments/layout::navbar}"></div>

        <main class="container-fluid p-4">

            <!-- SUCCESS MESSAGE -->
            <div th:if="${message}"
                 class="alert alert-success alert-dismissible fade show text-center"
                 role="alert">
                <div class="d-flex justify-content-center align-items-center">
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${message}">Success</span>
                </div>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"></button>
            </div>

            <!-- ERROR MESSAGE -->
            <div th:if="${error}"
                 class="alert alert-danger alert-dismissible fade show text-center"
                 role="alert">
                <div class="d-flex justify-content-center align-items-center">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span th:text="${error}">Error</span>
                </div>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"></button>
            </div>

            <!-- BREADCRUMB -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb mb-0">

                    <li class="breadcrumb-item">
                        <a th:href="@{/tests/results}"
                           class="text-decoration-none">
                            Tests
                        </a>
                    </li>

                    <li class="breadcrumb-item active"
                        aria-current="page">
                        Test Results
                    </li>

                </ol>
            </nav>

            <!-- PAGE HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h3 class="fw-bold mb-1">
                        <i class="bi bi-bar-chart me-2"></i>
                        Test Results
                    </h3>

                    <p class="text-muted mb-0">
                        View results for all tests
                    </p>
                </div>

            </div>

            <!-- RESULTS TABLE -->
            <div class="card border-0 shadow-sm">

                <div class="card-body p-0">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle mb-0">

                            <thead class="table-light">

                            <tr>
                                <th class="px-4">#</th>
                                <th>Test Name</th>
                                <th>Course</th>
                                <th>Subject</th>
                                <th>Chapter</th>
                                <th>Total Marks</th>
                                <th>Status</th>
                                <th class="text-center">Action</th>
                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="test, stat : ${tests}">

                                <td class="px-4"
                                    th:text="${stat.count}">
                                    1
                                </td>

                                <td>
                                    <strong th:text="${test.testName}">
                                        Test Name
                                    </strong>
                                </td>

                                <td th:text="${test.course}">
                                    NEET
                                </td>

                                <td th:text="${test.subject}">
                                    Physics
                                </td>

                                <td th:text="${test.chapter}">
                                    Chapter 1
                                </td>

                                <td th:text="${test.totalMarks}">
                                    100
                                </td>

                                <td>

                                    <span th:if="${test.status == 'PUBLISHED'}"
                                          class="badge bg-success">
                                        Published
                                    </span>

                                    <span th:unless="${test.status == 'PUBLISHED'}"
                                          class="badge bg-secondary">
                                        Draft
                                    </span>

                                </td>

                                <!-- ACTIONS -->
                                <td class="text-center">

                                    <div class="d-flex justify-content-center gap-2">

                                        <!-- VIEW -->
                                        <a th:href="@{/tests/results/{id}(id=${test.id})}"
                                           class="btn btn-sm btn-outline-primary"
                                           title="View Result">
                                            <i class="bi bi-eye"></i>
                                        </a>

                                        <!-- EDIT -->
                                        <a th:href="@{/tests/edit/{id}(id=${test.id})}"
                                           class="btn btn-sm btn-outline-warning"
                                           title="Edit Test">
                                            <i class="bi bi-pencil"></i>
                                        </a>

                                        <!-- DELETE -->
                                        <a th:href="@{/tests/delete/{id}(id=${test.id})}"
                                           class="btn btn-sm btn-outline-danger"
                                           title="Delete Test"
                                           onclick="return confirm('Are you sure you want to delete this test?');">
                                            <i class="bi bi-trash"></i>
                                        </a>

                                    </div>

                                </td>

                            </tr>

                            <!-- NO RESULTS -->
                            <tr th:if="${#lists.isEmpty(tests)}">

                                <td colspan="8"
                                    class="text-center py-5 text-muted">

                                    <i class="bi bi-bar-chart fs-1 d-block mb-3"></i>

                                    No test results found.

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>

<!-- SCRIPTS (Bootstrap JS + sidebar menu logic) -->
<div th:replace="~{fragments/layout::scripts}"></div>

<script>
    // Auto-hide flash messages after 4 seconds
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".alert").forEach(function (el) {
            setTimeout(function () {
                bootstrap.Alert.getOrCreateInstance(el).close();
            }, 4000);
        });
    });
</script>

</body>
</html>
