<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">

</head>


<body>


<!-- ========================================================= -->
<!-- SIDEBAR -->
<!-- ========================================================= -->

<div th:fragment="sidebar"
     class="bg-dark text-white"
     id="sidebar-wrapper">

    <!-- Logo / Heading -->

    <div class="sidebar-heading border-bottom border-secondary">

        <i class="bi bi-mortarboard-fill me-2"></i>

        SMS Admin

    </div>


    <!-- Sidebar Links -->

    <div class="list-group list-group-flush">


        <!-- Dashboard -->

        <a th:href="@{/dashboard}"
           class="sidebar-link">

            <i class="bi bi-speedometer2"></i>

            <span>Dashboard</span>

        </a>


        <!-- Courses -->

        <a th:href="@{/course/list}"
           class="sidebar-link">

            <i class="bi bi-book"></i>

            <span>Courses</span>

        </a>


        <!-- Students -->

        <a th:href="@{/students/list}"
           class="sidebar-link">

            <i class="bi bi-people"></i>

            <span>Students</span>

        </a>


        <!-- Enrolled Students -->

        <a th:href="@{/enrollments/enrollmentList}"
           class="sidebar-link">

            <i class="bi bi-check2-square"></i>

            <span>Enrolled Students</span>

        </a>


        <!-- Enroll to Course -->

        <a th:href="@{/enrollments/showEnroll}"
           class="sidebar-link">

            <i class="bi bi-person-plus"></i>

            <span>Enroll to Course</span>

        </a>


    </div>

</div>



<!-- ========================================================= -->
<!-- NAVBAR -->
<!-- ========================================================= -->

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-light bg-light border-bottom">


    <div class="container-fluid">


        <!-- Sidebar Toggle -->

        <button class="btn btn-outline-secondary"
                id="sidebarToggle"
                type="button">

            <i class="bi bi-list"></i>

        </button>



        <!-- Mobile Navbar Toggle -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>



        <!-- Navbar Content -->

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">


            <ul class="navbar-nav ms-auto mt-2 mt-lg-0">


                <!-- USER DROPDOWN -->

                <li class="nav-item dropdown">


                    <!-- User Button -->

                    <a class="nav-link dropdown-toggle d-flex align-items-center"
                       href="#"
                       id="navbarDropdown"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">


                        <!-- Profile Image -->

                        <img th:src="@{/profile/image}"
                             alt="Profile"
                             class="rounded-circle me-1 navbar-profile-img"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">


                        <!-- Default Icon -->

                        <i class="bi bi-person-circle me-1"
                           style="display:none;">
                        </i>


                        <!-- User Name -->

                        Admin User


                    </a>



                    <!-- ================================================= -->
                    <!-- DROPDOWN MENU -->
                    <!-- ================================================= -->

                    <div class="dropdown-menu dropdown-menu-end"
                         aria-labelledby="navbarDropdown">


                        <!-- PROFILE -->

                        <a class="dropdown-item"
                           th:href="@{/profile}">

                            <i class="bi bi-person me-2"></i>

                            Profile

                        </a>



                        <!-- SETTINGS -->

                        <a class="dropdown-item"
                           th:href="@{/settings}">

                            <i class="bi bi-gear me-2"></i>

                            Settings

                        </a>



                        <!-- Divider -->

                        <div class="dropdown-divider"></div>



                        <!-- LOGOUT -->

                        <form method="post"
                              th:action="@{/logout}"
                              style="margin:0;">


                            <!-- CSRF -->

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}" />


                            <!-- Logout Button -->

                            <button type="submit"
                                    class="dropdown-item">


                                <i class="bi bi-box-arrow-right me-2"></i>

                                Logout


                            </button>


                        </form>


                    </div>


                </li>


            </ul>


        </div>


    </div>


</nav>



<!-- ========================================================= -->
<!-- FOOTER -->
<!-- ========================================================= -->

<footer th:fragment="footer"
        class="py-4 bg-light mt-auto border-top">


    <div class="container-fluid px-4">


        <div class="d-flex align-items-center justify-content-between small">


            <div class="text-muted">

                Student Management System

            </div>


            <div class="text-muted">

                © 2026 SMS Admin

            </div>


        </div>


    </div>


</footer>



<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<th:block th:fragment="scripts">


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- Sidebar Toggle -->

    <script>

        window.addEventListener('DOMContentLoaded', event => {

            const sidebarToggle =
                document.body.querySelector('#sidebarToggle');

            if (sidebarToggle) {

                sidebarToggle.addEventListener('click', event => {

                    event.preventDefault();

                    document.body.classList.toggle(
                        'sb-sidenav-toggled'
                    );

                });

            }

        });

    </script>


</th:block>


</body>

</html>
