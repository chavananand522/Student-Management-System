<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<head>
    <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css" rel="stylesheet">
</head>

<body>

    <div class="d-flex" id="wrapper">

        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <div id="page-content-wrapper">

            <div th:replace="~{fragments/layout :: navbar}"></div>

            <div class="container-fluid px-4 py-4">

                <h2 class="mb-4">Profile</h2>

                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div id="jsError" class="alert alert-danger" style="display:none;"></div>

                <!-- Photo Card -->
                <div class="card mb-4">
                    <div class="card-body text-center">

                        <img id="currentImage"
                             th:src="@{/profile/image}"
                             onerror="this.src='https://via.placeholder.com/150?text=No+Image';"
                             class="rounded-circle mb-3 profile-page-img"
                             alt="Profile Image" />

                        <h5 class="mb-0" th:text="${user.fullName != null ? user.fullName : user.userName}"></h5>
                        <p class="text-muted" th:text="${user.role != null ? user.role : 'Administrator'}"></p>

                        <div class="mx-auto text-start" style="max-width: 360px;">
                            <input type="file" id="imageInput" accept="image/*" class="form-control">
                        </div>

                        <!-- Cropper preview, hidden until a file is chosen -->
                        <div id="cropContainer" class="mt-3 mx-auto" style="display:none; max-width: 360px;">
                            <div style="max-height: 320px;">
                                <img id="cropImage" style="max-width:100%;">
                            </div>
                            <button type="button" id="uploadBtn" class="btn btn-primary mt-3">
                                Crop &amp; Upload
                            </button>
                            <button type="button" id="cancelBtn" class="btn btn-outline-secondary mt-3">
                                Cancel
                            </button>
                        </div>

                    </div>
                </div>

                <div class="row g-4 mb-4">

                    <!-- Personal Information -->
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-white">Personal Information</div>
                            <div class="card-body">

                                <div id="profileViewBlock">
                                    <p><strong>Name:</strong>
                                        <span th:text="${user.fullName != null ? user.fullName : '—'}"></span></p>
                                    <p><strong>Email:</strong>
                                        <span th:text="${user.email != null ? user.email : '—'}"></span></p>
                                    <p><strong>Phone:</strong>
                                        <span th:text="${user.phoneNumber != null ? user.phoneNumber : '—'}"></span></p>
                                    <p><strong>Role:</strong>
                                        <span th:text="${user.role != null ? user.role : 'Administrator'}"></span></p>

                                    <button type="button" class="btn btn-outline-primary" id="editProfileBtn">
                                        Edit Profile
                                    </button>
                                </div>

                                <form method="post" th:action="@{/profile/update}" id="editProfileForm" style="display:none;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                    <div class="mb-3">
                                        <label class="form-label">Name</label>
                                        <input type="text" name="fullName" class="form-control"
                                               th:value="${user.fullName}">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" name="email" class="form-control"
                                               th:value="${user.email}">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Phone</label>
                                        <input type="text" name="phoneNumber" class="form-control"
                                               th:value="${user.phoneNumber}">
                                    </div>

                                    <button type="submit" class="btn btn-primary">Save</button>
                                    <button type="button" class="btn btn-outline-secondary" id="cancelEditBtn">Cancel</button>
                                </form>

                            </div>
                        </div>
                    </div>

                    <!-- Account Summary -->
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-white">Account Summary</div>
                            <div class="card-body">

                                <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                                    <span>Students</span>
                                    <span class="fw-bold fs-5" th:text="${totalStudents}"></span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                                    <span>Courses</span>
                                    <span class="fw-bold fs-5" th:text="${totalCourses}"></span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center py-2">
                                    <span>Enrollments</span>
                                    <span class="fw-bold fs-5" th:text="${totalEnrollments}"></span>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>

                <!-- Security -->
                <div class="card">
                    <div class="card-header bg-white">Security</div>
                    <div class="card-body">

                        <div id="passwordViewBlock">
                            <p><strong>Password:</strong> ********</p>
                            <button type="button" class="btn btn-outline-primary" id="changePasswordBtn">
                                Change Password
                            </button>
                        </div>

                        <form method="post" th:action="@{/profile/change-password}" id="changePasswordForm" style="display:none; max-width: 400px;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label class="form-label">Current Password</label>
                                <input type="password" name="currentPassword" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input type="password" name="newPassword" class="form-control" required minlength="6">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirm New Password</label>
                                <input type="password" name="confirmPassword" class="form-control" required minlength="6">
                            </div>

                            <button type="submit" class="btn btn-primary">Update Password</button>
                            <button type="button" class="btn btn-outline-secondary" id="cancelPasswordBtn">Cancel</button>
                        </form>

                    </div>
                </div>

            </div>

            <div th:replace="~{fragments/layout :: footer}"></div>

        </div>

    </div>

    <div th:replace="~{fragments/layout::scripts}"></div>

    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
    <script th:inline="javascript">
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfParam = /*[[${_csrf.parameterName}]]*/ '';

        // --- Image crop/upload ---
        const imageInput = document.getElementById('imageInput');
        const cropContainer = document.getElementById('cropContainer');
        const cropImage = document.getElementById('cropImage');
        const uploadBtn = document.getElementById('uploadBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const jsError = document.getElementById('jsError');

        let cropper = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                jsError.textContent = 'Please choose a valid image file.';
                jsError.style.display = 'block';
                return;
            }

            jsError.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (event) => {
                cropImage.src = event.target.result;
                cropContainer.style.display = 'block';

                if (cropper) {
                    cropper.destroy();
                }

                cropper = new Cropper(cropImage, {
                    aspectRatio: 1,
                    viewMode: 1,
                    autoCropArea: 1,
                    responsive: true,
                    background: false
                });
            };
            reader.readAsDataURL(file);
        });

        cancelBtn.addEventListener('click', () => {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            cropContainer.style.display = 'none';
            imageInput.value = '';
        });

        uploadBtn.addEventListener('click', () => {
            if (!cropper) return;

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';

            cropper.getCroppedCanvas({
                width: 400,
                height: 400,
                imageSmoothingQuality: 'high'
            }).toBlob((blob) => {

                const formData = new FormData();
                formData.append('image', blob, 'profile.jpg');
                formData.append(csrfParam, csrfToken);

                fetch('/profile/image', {
                    method: 'POST',
                    body: formData
                })
                .then((response) => {
                    if (!response.ok) {
                        throw new Error('Upload failed');
                    }
                    window.location.reload();
                })
                .catch(() => {
                    jsError.textContent = 'Upload failed. Please try again.';
                    jsError.style.display = 'block';
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'Crop & Upload';
                });

            }, 'image/jpeg', 0.9);
        });

        // --- Edit Profile toggle ---
        const editProfileBtn = document.getElementById('editProfileBtn');
        const editProfileForm = document.getElementById('editProfileForm');
        const profileViewBlock = document.getElementById('profileViewBlock');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        editProfileBtn.addEventListener('click', () => {
            profileViewBlock.style.display = 'none';
            editProfileForm.style.display = 'block';
        });
        cancelEditBtn.addEventListener('click', () => {
            editProfileForm.style.display = 'none';
            profileViewBlock.style.display = 'block';
        });

        // --- Change Password toggle ---
        const changePasswordBtn = document.getElementById('changePasswordBtn');
        const changePasswordForm = document.getElementById('changePasswordForm');
        const passwordViewBlock = document.getElementById('passwordViewBlock');
        const cancelPasswordBtn = document.getElementById('cancelPasswordBtn');

        changePasswordBtn.addEventListener('click', () => {
            passwordViewBlock.style.display = 'none';
            changePasswordForm.style.display = 'block';
        });
        cancelPasswordBtn.addEventListener('click', () => {
            changePasswordForm.style.display = 'none';
            passwordViewBlock.style.display = 'block';
        });
    </script>

</body>

</html>
